和執行步驟中，下列哪一個步驟需要最先執行，以確 定減量與移除目標？","options":{"A":"完成碳中和報告","B":"制定溫室氣體減量計畫專案","C":"界定範疇以及選定欲碳中和標的物","D":"直接進行碳抵換"},"answer":"C","source":"115年第1次官方考題","source_num":50,"exam":"115年第1次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qd53749f4ab36"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"事業單位依「溫室氣體排放量盤查登錄及查驗管理辦法」進行盤查時，溫室氣體 總排放量應計算至小數點後第幾位？","options":{"A":"第三位","B":"第一位","C":"第四位","D":"第二位"},"answer":"A","source":"115年第1次官方考題","source_num":1,"exam":"115年第1次官方考題","explanation":"","category":"盤查制度、法規與流程","id":"qbe6622bc1e84"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"進行組織型溫室氣體盤查時，某企業使用外購電力，並另外自設鍋爐補充熱能。 下列何種歸類方式最正確？","options":{"A":"自設鍋爐屬能源間接排放，外購電力屬直接排放","B":"外購電力屬能源間接排放，自設鍋爐屬直接排放","C":"兩者皆屬能源間接排放","D":"兩者皆屬直接排放"},"answer":"B","source":"115年第1次官方考題","source_num":2,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"qd52e4fc36dba"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於組織型溫室氣體盤查中，企業使用「委外物流」運輸產品，但不具有物流車 輛之控制權，則該運輸產生之溫室氣體排放應歸類為何？","options":{"A":"固定排放","B":"能源間接排放","C":"製程排放","D":"其他間接排放"},"answer":"D","source":"115年第1次官方考題","source_num":3,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"q7c87a106b8f0"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"若企業進行組織型溫室氣體盤查採用營運控制權原則設定邊界，下列哪一種情況 會被納入排放量？","options":{"A":"財務投資但無營運控制權","B":"無持股但具有營運決策權","C":"僅提供設備使用權","D":"與企業無契約關係"},"answer":"B","source":"115年第1次官方考題","source_num":4,"exam":"115年第1次官方考題","explanation":"","category":"組織與報告邊界","id":"q955e8943c1fa"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"若企業欲提高盤查結果的可查證性，下列哪一項行為最為重要？","options":{"A":"所有數據以估算方式呈現","B":"活動數據來源可追溯","C":"排除不確定數據","D":"僅呈現電力排放"},"answer":"B","source":"115年第1次官方考題","source_num":5,"exam":"115年第1次官方考題","explanation":"","category":"數據品質與不確定性","id":"q548745ca9cbc"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據 ISO14064-1：2018 之規範，關於「不確定性（Uncertainty） 」與「誤差 （Error） 」 ，下列敘述何者正確？","options":{"A":"透過校正儀器可以完全消除不確定性，但無法消除誤差","B":"誤差是指測量值與真值之間的差異，應予以修正","C":"若不確定性評估結果為±5%，代表數據錯誤率為 5%","D":"查驗機構的主要職責是計算不確定性，而非發現誤差"},"answer":"B","source":"115年第1次官方考題","source_num":6,"exam":"115年第1次官方考題","explanation":"","category":"數據品質與不確定性","id":"q45f272b96496"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據 ISO14064-1：2018 之規範，除了傳統的燃燒與製程排放外，直接排放 （Category 1）還額外包含下列哪一個項目？","options":{"A":"土地使用、土地使用變更及林業","B":"委外廢棄物處理","C":"租賃資產排放","D":"投資產生的排放"},"answer":"A","source":"115年第1次官方考題","source_num":7,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"q53db9cc58d49"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某企業使用 10,000 度的電力，每度電排放係數為 0.5kgCO2e，以及 1,000 公升柴 油用於發電機，每公升柴油排放係數為 2.5kgCO2e。請問該企業上述情境下的類別 一、類別二排放量分別為下列何者？","options":{"A":"5tCO2e，2.5tCO2e","B":"25tCO2e，50tCO2e","C":"0.5tCO2e，0.25tCO2e","D":"2.5tCO2e，5tCO2e"},"answer":"D","source":"115年第1次官方考題","source_num":8,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q15bf88dce2ff"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某工廠進行溫室氣體盤查，發現使用一台冰水機，其冷媒原始填充量為 0.007 公 噸，GWP 值為 1,136，自然溢散率為 7.4%，請問當年度未重新填充之情境下，其 溫室氣體排放量約為多少？","options":{"A":"58.8tCO₂e","B":"0.588tCO₂e","C":"5.88tCO₂e","D":"0.0588tCO₂e"},"answer":"B","source":"115年第1次官方考題","source_num":9,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"qd5e7251b6538"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"若企業採用財務控制權法（Financial Control Approach）界定組織邊界，下列何者 正確？","options":{"A":"僅需計入母公司之排放","B":"具有財務控制權之排放皆需納入盤查","C":"與營運控制法相同，不涉及財務決策","D":"該方法僅適用製造業"},"answer":"B","source":"115年第1次官方考題","source_num":10,"exam":"115年第1次官方考題","explanation":"","category":"組織與報告邊界","id":"qa9f4b80f1808"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"若 A 公司與 B 公司共同持有一項合資事業，各占 50%，依照環境部要求進行申 報，A 公司具有營運控制權，則兩家公司的排放量應如何計算？","options":{"A":"A 公司與 B 公司各計入 50%排放量","B":"A 公司應計入 100%排放量，B 公司不需計入","C":"A 公司僅需計入範疇三排放","D":"A 公司與 B 公司均不需計入排放"},"answer":"B","source":"115年第1次官方考題","source_num":11,"exam":"115年第1次官方考題","explanation":"","category":"組織與報告邊界","id":"qf5d0556c64e3"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某工廠將廠房屋頂出租給能源業者設置太陽能板，該太陽能電力全數「售予台 電」 ，工廠並未自用。在設定該工廠的ISO14064-1：2018 盤查邊界時，該太陽能 發電量及其減碳效益應如何處理？","options":{"A":"應計入類別 2，並扣抵工廠的用電排放","B":"應計入類別 1，視為自產能源","C":"不屬於該工廠的盤查邊界，不需列入清冊","D":"需列在類別 2，但排放係數設為 0"},"answer":"C","source":"115年第1次官方考題","source_num":12,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"q83ab3b177198"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某汽車租賃公司（出租人）將車輛租給客戶使用。若該租賃公司進行盤查，且不 掌握車輛的燃油控制權（由客戶自付） ，則客戶使用期間的排放，在租賃公司的報 告中屬於哪一類？","options":{"A":"類別 1：直接排放","B":"類別 3：運輸間接排放","C":"類別 4：上游租賃資產","D":"類別 5：下游租賃資產"},"answer":"D","source":"115年第1次官方考題","source_num":13,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"qb895553754da"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"企業採購一台射出成型機（資本物品） ，由設備商負責從國外運送到工廠。試問： （1）射出成型機製造過程的排放、 （2）射出成型機運送到工廠的排放，分別屬於 ISO 14064-1：2018 的哪一類？","options":{"A":"皆屬於類別 3","B":"（1）屬於類別 4；（2）屬於類別 3","C":"（1）屬於類別 2；（2）屬於類別 3","D":"皆屬於類別 4"},"answer":"B","source":"115年第1次官方考題","source_num":14,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"q5201d6cfb02d"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"工廠在盤查邊界內建置了太陽能發電設施，電力全數供廠內製程使用（自發自 用） ，未躉售給台電。關於這部分電力的排放邊界界定，下列敘述何者正確？","options":{"A":"屬於類別 1，但因太陽能係數為 0，故排放量為 0","B":"屬於類別 2，係數為 0","C":"不屬於盤查邊界，因為沒有向外購買","D":"視為碳抵換，可扣減其他排放"},"answer":"A","source":"115年第1次官方考題","source_num":15,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"qb98a50970f07"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某製造商於 113 年度燃燒天然氣達 8,000 立方公尺，用電量為 120,000kWh。碳排 放係數為 2.0 公斤 CO₂e/立方公尺，電力排放係數為 0.5 公斤 CO₂e/kWh。 請問該製造商 113 年度的總排放量為多少公噸二氧化碳？","options":{"A":"64,000","B":"16,000","C":"76","D":"60"},"answer":"C","source":"115年第1次官方考題","source_num":16,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"qc9a239f5a996"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"根據溫室氣體排放量盤查登錄及查驗管理辦法第四條規定，當以排放係數法計算 燃料燃燒產生之排放量，應以燃料用量乘以何者位階熱值及係數?","options":{"A":"高","B":"中","C":"低","D":"均可"},"answer":"C","source":"115年第1次官方考題","source_num":17,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q1d0e0bc61ae1"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"下列何者為排放係數法的公式？","options":{"A":"排放量=活動數據×排放係數×全球暖化潛勢值","B":"排放量=燃料使用量÷排放係數","C":"排放量=濃度數據×流率×全球暖化潛勢值","D":"排放量=排放源數量÷活動數據"},"answer":"A","source":"115年第1次官方考題","source_num":18,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"qc3173103ec1d"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"進行溫室氣體盤查時，若企業使用生質燃料（如生質柴油、木屑等） ，依據 IPCC 規範，關於其燃燒產生之二氧化碳（CO₂）排放量，應如何處理？","options":{"A":"屬於自然界循環，完全不需要計算或量化","B":"需量化計算，並直接加總計入公司的總排放量中","C":"需量化計算，但分別表列，不彙總到排放總量中","D":"視為類別 2 的間接排放計算"},"answer":"C","source":"115年第1次官方考題","source_num":19,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q724b297209e5"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"計算燃料燃燒排放時，若供應商僅提供「高位熱值（HHV） 」 ，依據指引建議的轉 換公式，針對「天然氣（氣態燃料） 」與「燃油（液態燃料） 」的低位熱值 （LHV）轉換比例分別為何？","options":{"A":"氣態 95%；液態 90%","B":"氣態 90%；液態 95%","C":"皆為 90%","D":"皆為 95%"},"answer":"B","source":"115年第1次官方考題","source_num":20,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q5aa4f36a8717"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某工廠整年度分三批次採購燃煤，每批次熱值不同。依據《113 年版溫室氣體排放 量盤查作業指引》 ，若要計算全年度的平均熱值以進行排放量計算，應採用下列何 種統計方法？","options":{"A":"算術平均法","B":"加權平均法","C":"直接採用數值最大者以保守估計","D":"採用最後一批次的熱值"},"answer":"B","source":"115年第1次官方考題","source_num":21,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q4e978e88e134"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"根據 ISO14064-1：2018 之規範，下列何者不屬於 GHG Protocol 的範疇三盤查邊 界？","options":{"A":"組織使用產品","B":"運輸","C":"輸入能源","D":"員工通勤"},"answer":"C","source":"115年第1次官方考題","source_num":22,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"qa473c07eb82b"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於事業購買再生能源電力，若該筆電力之排放係數以 0 計算，則下列敘述何者 正確？","options":{"A":"只要購買再生能源憑證（T-REC）即可，形式不拘","B":"憑證類型須為「電證合一」 ，並檢具轉供證明","C":"憑證類型為「電證分離」","D":"只要向台電申請綠電標章"},"answer":"B","source":"115年第1次官方考題","source_num":23,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q3a6e64773f04"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"溫室氣體盤查報告書中，下列何者為報告邊界所呈現的內容？","options":{"A":"描述績效追蹤的邊界","B":"描述盤查報告的期間","C":"描述組織的邊界與彙總方法","D":"描述組織所考量的排放類別"},"answer":"D","source":"115年第1次官方考題","source_num":24,"exam":"115年第1次官方考題","explanation":"","category":"組織與報告邊界","id":"q22e1734dd734"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在撰寫 ISO14064-1 盤查報告書時，若因數據無法取得而排除了某些次要排放源。 依據指引及 ISO 原則，報告書應如何呈現這些排除項目？","options":{"A":"僅在附錄中列出排除項目，不需在報告主體揭露","B":"僅需在清冊中標示\"0\"","C":"應透明陳述排除項目及其理由","D":"需取得環境部同意函"},"answer":"C","source":"115年第1次官方考題","source_num":25,"exam":"115年第1次官方考題","explanation":"","category":"盤查制度、法規與流程","id":"q37d6ed60500f"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"若查驗機構完成查證並提出「查驗總結報告」 ，且查驗過程中發現數據錯誤並已修 正，事業在最終定稿的盤查報告書與清冊中，應如何處理數據以符合規範要求？","options":{"A":"保留原始錯誤數據以示誠實","B":"報告書與清冊的數據必須與查驗結果完全一致","C":"報告書寫修正後的數據，清冊保留修正前的數據","D":"僅需修正總量，細項數據不需修正"},"answer":"B","source":"115年第1次官方考題","source_num":26,"exam":"115年第1次官方考題","explanation":"","category":"盤查制度、法規與流程","id":"qa2971024c7a7"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在報告書的「排放量計算」章節中，針對所引用的排放係數（例如電力係數、 GWP 值） ，下列哪一項揭露方式不符合指引要求？","options":{"A":"標註係數的發佈單位","B":"標註係數的年份或版本","C":"寫「引用官方係數」或「引用自軟體資料庫」","D":"使用自廠係數，說明檢測方法與日期"},"answer":"C","source":"115年第1次官方考題","source_num":27,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q9ddea88c4916"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"若企業在廠區內種植樹木（碳匯） ，並計算其碳移除量（Removal） 。在填寫排放清 冊時，這筆移除量應如何處理？","options":{"A":"直接與排放量相減，申報淨排放量","B":"填寫在「直接排放」欄位，並標示為負值","C":"填寫在獨立的「溫室氣體移除量」欄位，不得與排放量相抵扣","D":"視為購買綠電，係數設為 0"},"answer":"C","source":"115年第1次官方考題","source_num":28,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q31464d3959f9"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"企業發生下列哪一種變動時，通常不需要在當年度報告書中重訂基準年或調整歷 史數據？","options":{"A":"併購了一家排放量占總量 20%的新工廠","B":"出售了一家排放量占總量 15%的子公司","C":"發現過去使用的排放係數有重大錯誤，誤差> 5%","D":"因產能自然擴增，導致排放量較去年增加 10%"},"answer":"D","source":"115年第1次官方考題","source_num":29,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q757e69cccd78"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在查核一份盤查報告書時，發現其電力排放係數引用來源僅寫「經濟部能源署」 。 依據 ISO14064-1 對於資訊透明度的要求，這樣的描述缺少哪一項關鍵資訊，將導 致數據無法追溯？","options":{"A":"係數的計算公式","B":"係數的發佈日期或適用年份","C":"能源署的地址","D":"台電的董事長姓名"},"answer":"B","source":"115年第1次官方考題","source_num":30,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q4691859bb5c8"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於國內產品碳足跡計算的相關指引，在設定切斷原則時，任何單一溫室氣體源 之排放貢獻占產品預期之生命週期內溫室氣體排放量若低於多少百分比，可於盤 查時被忽略；且所有被忽略項目的累積不得超過總排放量的多少百分比？","options":{"A":"單一源≤5%；累積不得超過 10%","B":"單一源≤1%；累積不得超過 5%","C":"單一源≤0.5%；累積不得超過 1%","D":"單一源≤10%；累積不得超過 20%"},"answer":"B","source":"115年第1次官方考題","source_num":31,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q4446a938cd63"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"根據《氣候變遷因應法》第三十七條，中央主管機關審查核定產品碳足跡後，業 者應於規定期限內依核定內容對產品進行何種標示？","options":{"A":"零碳標示","B":"分級標示","C":"再生能源比例標示","D":"碳中和承諾標示"},"answer":"B","source":"115年第1次官方考題","source_num":32,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qc14ac9060449"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據 ISO14067：2018 標準，於進行碳排放數據量化時，若存在需分配的排放源， 則下列關於排放分配原則之引用優先順序何者正確？","options":{"A":"物理性分配→經濟分配→無分配","B":"經濟分配→物理性分配→無分配","C":"無分配→經濟分配→物理性分配","D":"無分配→物理性分配→經濟分配"},"answer":"D","source":"115年第1次官方考題","source_num":33,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qb934ca36d5a3"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"下列何者為使用「排放係數法」計算燃料燃燒所產生之溫室氣體排放量時，所必 須具備的數據？","options":{"A":"燃料消耗量與低位熱值","B":"設備的總負荷量","C":"燃料價格與碳稅","D":"溫室氣體排放清冊的類別"},"answer":"A","source":"115年第1次官方考題","source_num":34,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q996dc161da15"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於生命週期評估（Life Cycle Assessment, LCA）的功能單位（Functional Unit, FU） ，下列何者為其主要目的？","options":{"A":"作為溝通產品外觀特性的指標","B":"作為產品生命週期的量化基準","C":"用於計算公司年度排放量","D":"僅提供使用階段的排放基礎"},"answer":"B","source":"115年第1次官方考題","source_num":35,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qb26743b40f15"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在生命週期衝擊評估（Life Cycle Impact Assessment, LCIA）中，將生命週期盤查 （Life Cycle Inventory, LCI）的結果轉化為衝擊指數時，其程序依序為：分類、特 徵化，接下來是哪一個步驟？","options":{"A":"決策","B":"替代方案之排序","C":"權重","D":"評價模式及方法"},"answer":"C","source":"115年第1次官方考題","source_num":36,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q5a11357b7254"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於產品碳足跡（Product Carbon Footprint, CFP）或部分 CFP 之生命週期衝擊評 估（Life Cycle Impact Assessment, LCIA）中，計算產品系統的潛在氣候變遷衝擊 時，應採用哪一種時間範圍的全球暖化潛勢？","options":{"A":"20 年","B":"50 年","C":"100 年","D":"200 年"},"answer":"C","source":"115年第1次官方考題","source_num":37,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qf1ae6f86616b"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"下列哪一項屬於生命週期評估（Life Cycle Assessment, LCA）的限制？","options":{"A":"無法分析環境衝擊","B":"無法定義產品是否永續","C":"無法使用數據","D":"無法應用於製造業"},"answer":"B","source":"115年第1次官方考題","source_num":38,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q5cc9d26b8c78"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"根據 ISO14025：2006 的規定，產品類別規則（Product Category Rules, PCR）委員 會在制定 PCR 文件時應收集或製作適當的生命週期評估（Life Cycle Assessment, LCA）以告知其發展過程，此 LCA 的主要作用是？","options":{"A":"確保單一企業內部碳排報告的保密性","B":"決定產品的功能單位應使用何種貨幣","C":"確保特定產品類別內 EPD 之間的可比性","D":"規定產品的最終處置方式"},"answer":"C","source":"115年第1次官方考題","source_num":39,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qabc6b804ba62"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"下列哪一種溫室氣體不是類別一固定式燃燒源的排放物？","options":{"A":"二氧化碳（CO₂）","B":"甲烷（CH₄）","C":"氧化亞氮（N₂O）","D":"六氟化硫 (SF₆)"},"answer":"D","source":"115年第1次官方考題","source_num":40,"exam":"115年第1次官方考題","explanation":"","category":"排放源與類別判定","id":"qa199348cd4ac"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某公司有一部柴油發電機，盤查同時收集到現場的完整柴油使用紀錄、針對該發 電機的柴油採購金額、發電機的運轉時間等資料，請問該以下列何者作為活動數 據較佳？","options":{"A":"使用現場使用紀錄統計年度實際用量","B":"使用採購金額回推柴油數量","C":"利用運轉時間跟手冊上單位時間耗用量來計算年度用油量","D":"以上皆可"},"answer":"A","source":"115年第1次官方考題","source_num":41,"exam":"115年第1次官方考題","explanation":"","category":"排放量計算與係數","id":"q2de07aadc7d9"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"根據 ISO14067：2018 的條文更新，當產品碳足跡的量化涉及能源屬性憑證 （EACs） ，在電網相互連接的情況下，若使用不同電力追溯系統可能導致結果差 異，應執行並報告哪一種分析結果？","options":{"A":"質量平衡分析","B":"財務審計分析","C":"敏感度分析","D":"總量平衡分析"},"answer":"C","source":"115年第1次官方考題","source_num":42,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q1078d9d079a4"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在生命週期評估（Life Cycle Assessment, LCA）中，當進行敏感性分析時，應主要 關注哪一類因素？","options":{"A":"關鍵數據的估算假設與不確定性","B":"製程運行順序或工序選擇差異","C":"原物料價格或市場供需波動","D":"產品設計變更對功能性能的影響"},"answer":"A","source":"115年第1次官方考題","source_num":43,"exam":"115年第1次官方考題","explanation":"","category":"數據品質與不確定性","id":"qc2ea490ad86c"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"根據環境部碳足跡產品類別規則訂定、引用及修訂指引規定，要求在取得環境部 文件登錄編號後，產品類別規則（PCR）應在下列何時內制定完成，以提送工作 小組審查？","options":{"A":"60 個工作天內","B":"3 個月內","C":"半年內","D":"一年內"},"answer":"C","source":"115年第1次官方考題","source_num":44,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q8c39f7462903"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在生命週期評估（Life Cycle Assessment, LCA）中，下列哪一項資訊於闡釋階段可 不用進行說明？","options":{"A":"得採結論與建議的形式給予決策者","B":"闡釋合併盤查分析與衝擊評估的觀察結果","C":"對未來新產品的環境衝擊改變之影響","D":"將盤查分析的觀察結果，與目的及範疇整合一致之階段，以達成結論與建議"},"answer":"C","source":"115年第1次官方考題","source_num":45,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q28915d193de7"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"下列哪一項產品類型無法向環境部申請取得產品碳足跡標籤？","options":{"A":"矽晶圓片","B":"高鐵服務","C":"百貨禮品","D":"高粱酒"},"answer":"A","source":"115年第1次官方考題","source_num":46,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q5440f3b15c51"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在計算產品碳足跡（Product Carbon Footprint, CFP）時，為何不建議使用組織型碳 盤查（GHG）的電力排碳係數？","options":{"A":"GHG 係數僅用於 B2C 產品，不適用 CFP","B":"GHG 係數只計算發電過程的排放","C":"CFP 係數只考慮綠色能源，GHG 係數考慮所有能源。","D":"CFP 係數由台電提供，GHG 係數由環境部提供"},"answer":"B","source":"115年第1次官方考題","source_num":47,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q28ca9abf28a8"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於作為碳足跡溝通所需依據 ISO 標準，下列何者不正確？","options":{"A":"ISO14044","B":"ISO14068-1","C":"ISO14026","D":"ISO14071"},"answer":"B","source":"115年第1次官方考題","source_num":48,"exam":"115年第1次官方考題","explanation":"","category":"其他盤查實務","id":"qaa8ad2c84367"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於依據 ISO14067：2018 進行之產品碳足跡（Product Carbon Footprint, CFP）研 究報告內容，下列哪一項資訊應於報告中予以「分開描述」？","options":{"A":"預期應用及對象","B":"碳足跡揭露報告摘要","C":"生質碳排放量與移除量","D":"數據品質評估與敏感度分析結果"},"answer":"C","source":"115年第1次官方考題","source_num":49,"exam":"115年第1次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qf69abb5d663e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"若產品是持續性的提供，溫室氣體排放評估應涵蓋至少多久期間？","options":{"A":"一季","B":"半年","C":"一年","D":"三年"},"answer":"C","source":"115年第1次官方考題","source_num":50,"exam":"115年第1次官方考題","explanation":"","category":"其他盤查實務","id":"qfb8b8a8172fa"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據《聯合國氣候變化綱要公約》 （UNFCCC）所揭示之「共同但有區別的責任及 各自能力（CBDR-RC） 」原則，下列敘述何者正確？","options":{"A":"所有國家均需承擔相同的減排義務","B":"開發中國家需首先實現碳中和目標","C":"考量國家的經濟實力，忽略歷史排放責任","D":"發達國家應率先減排，並支持開發中國家"},"answer":"D","source":"115年第2次官方考題","source_num":1,"exam":"115年第2次官方考題","explanation":"","category":"國際氣候治理與政策","id":"q640830aed0b5"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據《巴黎協定》規定，關於國家自定貢獻（Nationally Determined Contributions, NDC）之特性，下列敘述何者正確？","options":{"A":"各國首次提交 NDC 後，其減量目標即不得修正，以確保國際氣候治理制度之 穩定性","B":"各國可自行決定 NDC 之提交頻率與內容格式， 《巴黎協定》並未建立共同規範 或要求","C":"各締約方應至少每五年提交一次 NDC，並參考全球盤點結果，逐步提升減量目 標之企圖心","D":"NDC 制度主要適用於開發中國家，已開發國家則以提供氣候資金與技術協助為 主要義務"},"answer":"C","source":"115年第2次官方考題","source_num":2,"exam":"115年第2次官方考題","explanation":"","category":"國際氣候治理與政策","id":"q9b820fc68d2b"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"在 COP28 會議中，關於「加速能源轉型」所提出的具體行動，下列敘述何者正 確？","options":{"A":"到 2030 年將全球再生能源裝置容量提升至現有的兩倍","B":"到 2030 年實現所有國家的能源完全脫碳","C":"實現發電碳密度降低至零，且停止所有核能項目","D":"提高再生能源發電占比，並減少化石燃料補貼"},"answer":"D","source":"115年第2次官方考題","source_num":3,"exam":"115年第2次官方考題","explanation":"","category":"能源與減碳技術","id":"q0f653186b7a3"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"「巴黎協定」第 6.4 條「巴黎協定額度機制（PACM） 」終於在亞塞拜然COP29 中 拍板通過。關於本項決議所造成的影響，下列敘述何者不正確？","options":{"A":"將建立一個全球碳市場規範，提升碳權品質與資訊透明度，從而吸引更多國家 和企業投入碳交易","B":"要求減量額度必須要符合真實性，保守性（即在計算移除量或減排量時應保守 估計避免高估）","C":"不限聯合國會員或《巴黎協定》締約方參與，這為臺灣開出了一扇參與國際碳 市場的門","D":"臺灣政府有機會能透過聯合國全球碳市場協助他國減碳，但減排成果不可納入 臺灣的國家自定貢獻（NDC）"},"answer":"D","source":"115年第2次官方考題","source_num":4,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q7775e8e12063"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"COP30 正式決議中提出「全球共作／全球動員（Global Mutirão） 」 ，其意涵最接近 下列何者？","options":{"A":"全球共同動員、加速與擴大氣候行動","B":"建立全球一致的碳稅並統一各國環境稅率","C":"全面禁止各國進行碳權買賣與市場交易機制","D":"限制氣候政策僅能由各國官方政府獨自執行"},"answer":"A","source":"115年第2次官方考題","source_num":5,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qb6f6255e9717"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"某大型跨國製造企業 M 為了向投資人展現其氣候風險管理和永續績效，決定編寫 一份符合國際標準的永續報告書。下列何種標準組合能最有效地幫助 M 公司達成 「向投資人溝通氣候變遷對公司財務的影響」及「揭露行業特定的永續績效指 標」這兩個目標？","options":{"A":"TCFD（氣候相關財務揭露）與 GRI（全球報告倡議）","B":"TCFD（氣候相關財務揭露）與 SASB（永續會計準則委員會）","C":"RE100 倡議與 SBTi（科學基礎減量目標倡議）","D":"ISO 14064-1 溫室氣體盤查清冊與 ISO 14067 產品碳足跡"},"answer":"B","source":"115年第2次官方考題","source_num":6,"exam":"115年第2次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"q5577ca9219ff"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"根據環境部推動之「抗高溫調適行動路徑」 ，其規劃包含「兩制度、兩方法、兩拓 展」 。其中， 「兩方法」除「試辦建置抗高溫涼適地圖（Cool Map） 」外，另一項為 下列何者？","options":{"A":"建立高溫應變啟動機制","B":"舉辦北中南抗高溫行動展","C":"研擬企業抗高溫行動指引","D":"大數據分析強化氣候關懷行動"},"answer":"C","source":"115年第2次官方考題","source_num":7,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"q097d440d49f4"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據《2024 年中華民國國家溫室氣體排放清冊報告》 （統計至2022 年） ，電力部門 仍為臺灣溫室氣體排放的重要來源。此數據對能源轉型的主要啟示為何？","options":{"A":"推動產業節能，即可達成 2050 淨零目標，無須調整電力結構","B":"電力部門排放占比較低，因此可延後推動其減碳措施","C":"淨零路徑應以增加化石燃料發電作為主要策略方向","D":"電力系統去碳化為產業與住商部門低碳轉型之關鍵基礎"},"answer":"D","source":"115年第2次官方考題","source_num":8,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"qf1854b962610"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"近年我國因應電力供需型態變化，調整電力系統尖峰與離峰電價時段，其主要驅 動因素為何？","options":{"A":"燃煤電廠逐步除役，導致全天供電能力下降","B":"太陽光電占比增加，改變白天與傍晚供電型態","C":"國際燃料價格波動，改變尖離峰時段劃分","D":"核能發電量增加，使夜間供電過剩"},"answer":"B","source":"115年第2次官方考題","source_num":9,"exam":"115年第2次官方考題","explanation":"","category":"能源與減碳技術","id":"qa3fc371c4293"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於臺灣能源轉型策略中「電力系統與儲能」戰略，下列何者最符合其核心目 標？","options":{"A":"建置分散式能源系統，逐步降低集中式電網之供電比重","B":"提升電網韌性並降低再生能源間歇性對供電穩定造成的衝擊","C":"擴大傳統發電設施容量，以滿足未來整體用電需求","D":"提高跨境電力交易比例，以增加低碳電力供應來源"},"answer":"B","source":"115年第2次官方考題","source_num":10,"exam":"115年第2次官方考題","explanation":"","category":"能源與減碳技術","id":"q0e8bbb7eb060"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於淨零排放（Net Zero Emissions）之概念，下列敘述何者正確？","options":{"A":"淨零排放係指完全消除所有溫室氣體排放，包含技術上或經濟上無法避免之排 放亦不得存在","B":"淨零排放係指溫室氣體排放量與透過移除或抵換機制所減除之排放量達成平 衡","C":"淨零排放之管理範圍主要以二氧化碳為主，因此甲烷、氧化亞氮等其他溫室氣 體通常不納入管理","D":"組織一旦達成淨零排放目標後，即可停止後續之排放盤查、監測及減量管理工 作"},"answer":"B","source":"115年第2次官方考題","source_num":11,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q0d298376fd6e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於碳市場交易中所稱之「碳排放權（Emission Allowance） 」 ，下列敘述何者正 確？","options":{"A":"指各國政府依法對溫室氣體排放行為進行監督與管理之行政權限","B":"指允許國家、企業或組織於一定額度範圍內排放溫室氣體之權利","C":"指於金融市場中交易之衍生性商品，主要用於投資與避險操作","D":"指國際組織針對企業永續發展與 ESG 績效所制定之揭露規範"},"answer":"B","source":"115年第2次官方考題","source_num":12,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q3a6a527f0959"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"下列何項名詞是指將二氧化碳或其他溫室氣體自排放源或大氣中持續移除後，吸 收或儲存之樹木、森林、土壤、海洋、地層、設施或場所？","options":{"A":"碳匯","B":"碳權","C":"碳中和","D":"碳封存"},"answer":"A","source":"115年第2次官方考題","source_num":13,"exam":"115年第2次官方考題","explanation":"","category":"淨零、碳中和與碳匯","id":"q95fe2dbe6a30"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於「碳中和」與「淨零排放」差異之描述，下列何者不正確？","options":{"A":"碳中和僅需二氧化碳排放與移除達平衡","B":"淨零排放必須考慮所有的溫室氣體排放","C":"碳中和的抵銷方法可包含種樹等碳移除方式","D":"淨零排放不包含大氣中溫室氣體的移除"},"answer":"D","source":"115年第2次官方考題","source_num":14,"exam":"115年第2次官方考題","explanation":"","category":"淨零、碳中和與碳匯","id":"q7ba822e1a675"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於「負碳技術（Carbon Negative Technologies） 」的判定原則，下列何者正確？","options":{"A":"透過提升能源效率降低溫室氣體排放，即可視為負碳技術","B":"捕集並封存化石燃料燃燒產生的二氧化碳，即可使整體系統達到負碳","C":"從大氣中移除的二氧化碳總量，必須大於系統排放至大氣中的總量","D":"負碳技術只要達到碳中和，即可視為完成負碳目標"},"answer":"C","source":"115年第2次官方考題","source_num":15,"exam":"115年第2次官方考題","explanation":"","category":"淨零、碳中和與碳匯","id":"q4e46c2cc798e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"國際間愈來愈多投資人、金融機構及利害關係人要求企業揭露氣候變遷對財務之 影響。企業通常依循下列哪一項國際架構進行氣候相關財務資訊揭露？","options":{"A":"氣候相關財務揭露（TCFD）","B":"碳揭露計畫（CDP）","C":"科學基礎目標倡議（SBTi）","D":"再生能源倡議（RE100）"},"answer":"A","source":"115年第2次官方考題","source_num":16,"exam":"115年第2次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"qf2de9228e982"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據《巴黎協議》第六條（Article 6）有關國際轉讓減量成果（Internationally Transferred Mitigation Outcomes, ITMOs）之規範，下列何者屬於 ITMOs 運作的核 心要求？","options":{"A":"各國可自行認定減量成果，無須進行跨國協調或資訊揭露","B":"減量成果須經參與國家授權，並執行相應調整以避免重複計算","C":"減量成果得由不同國家同時認列，以提升全球減量績效之彈性","D":"國際轉讓之減量成果必須全部來自森林碳匯或其他自然碳吸收措施"},"answer":"B","source":"115年第2次官方考題","source_num":17,"exam":"115年第2次官方考題","explanation":"","category":"淨零、碳中和與碳匯","id":"qd0fd3ffc39da"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"根據國際能源總署（International Energy Agency, IEA）2050 淨零排放情境之推 估，下列何者為未來全球能源消費的重要趨勢？","options":{"A":"天然氣將取代石油成為化石燃料來源","B":"電力消費占比大幅增加，預計至 2050 年成長至近半數","C":"總能源供給量可因為人口成長而持續增加","D":"再生能源的成長會因為核能的普及而停滯"},"answer":"B","source":"115年第2次官方考題","source_num":18,"exam":"115年第2次官方考題","explanation":"","category":"能源與減碳技術","id":"q78d5cce599c5"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於全球報告倡議組織（Global Reporting Initiative, GRI）報告框架與永續會計準 則委員會（Sustainability Accounting Standards Board, SASB）標準之主要差異，下 列敘述何者正確？","options":{"A":"GRI 提供行業特定的報告標準，而 SASB 則是通用標準，適用於所有行業","B":"GRI 和 SASB 的標準完全一致，只是使用不同的名稱來區分它們的報告框架","C":"GRI 注重財務重要性，而 SASB 更關注企業的社會影響和可持續發展","D":"GRI 重於企業的整體可持續性表現，而 SASB 專注於財務重要性"},"answer":"D","source":"115年第2次官方考題","source_num":19,"exam":"115年第2次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"qc77bdbe73460"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於碳揭露計畫（Carbon Disclosure Project, CDP）問卷設計中，下列何者屬於 CDP 用以支持企業達成淨零排放目標的重要評估方法？","options":{"A":"整合科學基礎減量目標倡議（SBTi），作為評估企業減量目標及排放路徑之重 要依據","B":"建立適用於所有產業之統一碳成本核算公式，以作為企業減量績效之主要評估 依據","C":"規定所有企業均須優先揭露 Scope 3 排放量，並以其作為評等分級之唯一標 準","D":"針對高耗能產業設計固定之減排行動方案，要求企業依照標準流程執行減碳措 施"},"answer":"A","source":"115年第2次官方考題","source_num":20,"exam":"115年第2次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"qb421825a31cb"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"下列何者最符合科學基礎減量目標倡議（Science Based Targets initiative, SBTi）對 Scope 3 排放管理之觀點？","options":{"A":"Scope 3 屬間接排放，企業無管理責任","B":"Scope 3 僅包含企業購電造成之排放","C":"Scope 3 可由企業單方面完全控制","D":"Scope 3 涵蓋價值鏈上下游之排放"},"answer":"D","source":"115年第2次官方考題","source_num":21,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q8635e688f15a"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"氣候相關財務揭露（Task Force on Climate-related Financial Disclosures, TCFD）建 議企業應針對氣候風險與機會進行資訊揭露，其核心要素為何？","options":{"A":"溫室氣體盤查、第三方查證、資訊揭露及主管機關登錄","B":"治理、策略、風險管理、指標與目標","C":"能源部門、工業部門、運輸部門及住商部門之減碳管理措施","D":"經濟面、環境面、社會面及公正轉型等永續發展推動面向"},"answer":"B","source":"115年第2次官方考題","source_num":22,"exam":"115年第2次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"q1cb8a0b1d94b"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於科學基礎減量目標倡議（Science Based Targets initiative, SBTi）之內容，下列 敘述何者正確？","options":{"A":"要求企業僅透過碳抵換（Offset）達成淨零目標，而非進行實質減排","B":"旨在鼓勵企業設定符合《巴黎協定》溫控目標的科學基礎減碳路徑","C":"目標經審核通過後，企業無須再進行定期檢視或更新","D":"適用於跨國大型企業，中小型企業無法申請"},"answer":"B","source":"115年第2次官方考題","source_num":23,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q6949d605f8cd"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於再生能源倡議 RE100 之會員加入規範，下列敘述何者正確？","options":{"A":"企業須承諾於 2050 年達成 100%使用再生能源，且核能可納入綠電使用計算","B":"加入之企業需每年至少有 100GWh 的電力需求，且必須以「集團層級」的身分 加入","C":"全體已編製永續報告書之上市櫃公司","D":"會員應透過碳揭露計畫（CDP）定期揭露進度，未達目標年度前得免逐年更新 再生能源使用情形"},"answer":"B","source":"115年第2次官方考題","source_num":24,"exam":"115年第2次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"q4d9620c9ac6e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據國際永續準則理事會（ISSB）發布之國際財務報導準則IFRS S2《氣候相關 揭露》 ，企業應揭露哪些範疇（Scope）之溫室氣體排放資訊？","options":{"A":"強制揭露 Scope 1","B":"強制揭露 Scope 2","C":"強制揭露 Scope 1 與 Scope 2","D":"須揭露 Scope 1、Scope 2 與 Scope 3"},"answer":"D","source":"115年第2次官方考題","source_num":25,"exam":"115年第2次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"q4c4179c82cd0"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"在永續發展報告的生態系統中，全球報告倡議組織（Global Reporting Initiative, GRI） 、永續會計準則委員會（Sustainability Accounting Standards Board, SASB）及 碳揭露計畫（Carbon Disclosure Project, CDP）各自服務於不同的目的和受眾。關 於這三個揭露框架及其應用，下列何者不正確？","options":{"A":"CDP 著重氣候與環境數據揭露，常作為投資人與採購機構評估企業氣候行動之 依據","B":"GRI 提供利害關係人導向框架，涵蓋環境社會治理面向，強調透明度與完整資 訊揭露","C":"SASB 以投資人為主要對象，聚焦具財務重大性之永續議題與風險機會之揭 露","D":"金融機構因應 SEC 財務重大性要求，應優先採用 GRI 並可取代 SASB 與 TCFD 以簡化報告"},"answer":"D","source":"115年第2次官方考題","source_num":26,"exam":"115年第2次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"q083a1a8a272d"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"歐盟碳邊境調整機制（Carbon Border Adjustment Mechanism, CBAM）的主要目的 為何？","options":{"A":"鼓勵歐盟企業將工廠轉移至境外的國家","B":"防止碳洩漏，並維護全球貿易的公平競爭環境","C":"降低歐盟境內企業的溫室氣體排放費用","D":"完全禁止高碳排產品進入歐盟的消費端"},"answer":"B","source":"115年第2次官方考題","source_num":27,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qd3b5203fc406"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於歐盟碳邊境調整機制（Carbon Border Adjustment Mechanism, CBAM）之申報 要求，下列何者正確？","options":{"A":"進口商應於相關報關文件中申報符合之豁免或適用資格","B":"出口商應於產品規格文件中揭露碳權交易紀錄","C":"製造商應於環境影響評估文件中完成 CBAM 申報","D":"供應商應於能源管理系統文件中聲明適用條件"},"answer":"A","source":"115年第2次官方考題","source_num":28,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qac14376fc524"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"在歐盟碳邊境調整機制（Carbon Border Adjustment Mechanism, CBAM）的規定 中，每張 CBAM 憑證等同多少碳排放量？","options":{"A":"一公噸產品於生產過程所產生的直接碳排放量","B":"一公噸二氧化碳當量之碳排放量","C":"一公噸產品生命週期碳足跡所對應之排放量","D":"一公噸產品於歐盟境內運輸所產生之碳排放量"},"answer":"B","source":"115年第2次官方考題","source_num":29,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qefe1018ce581"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於歐盟碳邊境調整機制（Carbon Border Adjustment Mechanism, CBAM）排放量 計算原則，下列敘述何者不正確？","options":{"A":"CBAM 排放量需考慮製程中的直接排放和電力消費的間接排放","B":"對於複雜產品之排放量計算，CBAM 對預設值的使用比例設有限制，例如過渡 期最高不得超過 20%","C":"產品排放量計算僅需考慮生產設施內之燃料燃燒排放，不需納入外部能源供應 相關排放","D":"CBAM 監測與申報制度並未要求企業直接依循 ISO 14064-1 或 ISO 14067，而 係依據歐盟所制定之專屬計算方法辦理"},"answer":"C","source":"115年第2次官方考題","source_num":30,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q64d1455d8cb2"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據歐盟碳邊境調整機制（Carbon Border Adjustment Mechanism, CBAM）規定， 在計算複雜產品之內含排放量時，若其使用之「前驅物（Precursors） 」係來自歐盟 境內或 CBAM 豁免國家，則該前驅物之排放量應如何處理？","options":{"A":"計算該設施的實際排放量","B":"使用該國家的預設值","C":"視為零排放","D":"按全球平均值計算"},"answer":"C","source":"115年第2次官方考題","source_num":31,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q2a9e005d4526"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"某鋼鐵產品出口至歐盟，生產過程使用外部供應之電力與蒸汽。關於歐盟碳邊境 調整機制（Carbon Border Adjustment Mechanism, CBAM）嵌入排放計算原則，下 列敘述何者正確？","options":{"A":"僅計算廠內燃料燃燒造成之直接排放","B":"外部能源排放皆不屬於產品排放範圍","C":"應依規定納入相關能源造成之排放","D":"僅需申報原料階段之排放量"},"answer":"C","source":"115年第2次官方考題","source_num":32,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q9fa06db634b3"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於我國推動能源效率提升政策之作法，下列何者最符合現行推動方向？","options":{"A":"推動高效率空調、照明與設備","B":"增加所有電價補貼","C":"提高能源使用總量，以維持產業競爭力與經濟成長","D":"優先增加能源供給能力，取代各項節能改善措施"},"answer":"A","source":"115年第2次官方考題","source_num":33,"exam":"115年第2次官方考題","explanation":"","category":"能源與減碳技術","id":"qdc51095cc6b6"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於我國 2050 淨零排放路徑之能源轉型方向，下列何者正確？","options":{"A":"降低高碳能源依賴，擴大再生能源應用，並發展低碳新興能源","B":"提高天然氣使用占比，延後再生能源建置，逐步推動能源轉型","C":"維持既有能源結構配置，透過提升供電能力達成減碳目標","D":"集中發展單一替代能源，藉以取代多元能源轉型策略"},"answer":"A","source":"115年第2次官方考題","source_num":34,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"qc4a6ba47449e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於我國 2050 淨零轉型中的「社會轉型」 ，最核心的目標為何？","options":{"A":"增加執法單位強制取締排碳者的權力與罰則","B":"確保轉型過程中「公正轉型」 ，不遺落任何人","C":"推動產業低碳製程，提升企業減碳技術與競爭力","D":"建立智慧電網系統，提高整體能源使用效率"},"answer":"B","source":"115年第2次官方考題","source_num":35,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"q5e1327537b48"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於「氫能」在我國 2050 淨零路徑中的定位，下列敘述何者不正確？","options":{"A":"為 12 項關鍵戰略之一，規劃應用於工業高溫製程與重型運輸","B":"包含發展氨能發電技術，以作為氫能應用的一環","C":"臺灣現階段之燃氣發電機組已全面完成 20%氫氣混燒之商業化運轉","D":"規劃包含建立進口氫能接收與儲存之基礎設施"},"answer":"C","source":"115年第2次官方考題","source_num":36,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"qcb1fa6af513e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"國家發展委員會推動我國「2050 淨零轉型」路徑中，積極倡導數位轉型與綠色轉 型的「雙軸轉型」 。關於數位技術如何賦能（Enable）並輔助企業與政府進行減 碳，下列敘述何者不正確？","options":{"A":"透過物聯網（IoT）與智慧感測器，能即時收集製程能耗數據，建立碳盤查與 碳足跡的數位化管理系統","B":"利用人工智慧（AI）與大數據分析，可優化供應鏈物流排程與建築能源管理系 統（BEMS） ，達到節能減碳","C":"數位轉型雖能提升能源管理效率，但數位設備本身（如資料中心）的能耗，在 政策上不需納入溫室氣體盤查邊界","D":"引進數位雙生（Digital Twin）技術，可在虛擬環境中模擬製程改良，減少實體 試錯過程中的能源與資源浪費"},"answer":"C","source":"115年第2次官方考題","source_num":37,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"q1e12a58c4975"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"下列哪一選項最能描述碳洩漏（Carbon Leakage）之現象？","options":{"A":"因環保技術不足或能源轉型緩慢，導致整體減碳成效不佳","B":"產業因溫室氣體管制成本增加，而轉移至管制較寬鬆之國家","C":"因無法即時導入先進技術，致使企業碳排放難以有效降低","D":"國內企業污染排放量完全控制在低水準，而使碳排放增加"},"answer":"B","source":"115年第2次官方考題","source_num":38,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"q31fd6f6de09e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於「碳信用額度（Carbon Credit） 」核發之品質要求，下列何者不屬於其核心評 估原則？","options":{"A":"市場流動性","B":"避免重複計算","C":"排放減量之真實性","D":"減量成果之外加性"},"answer":"A","source":"115年第2次官方考題","source_num":39,"exam":"115年第2次官方考題","explanation":"","category":"其他基礎概念","id":"q51ab63d2558b"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"企業進行碳資產與碳管理評估時，導入內部碳價（Internal Carbon Pricing, ICP）的 主要目的為何？","options":{"A":"增加碳權交易收益","B":"將碳成本納入投資決策","C":"取代企業減碳目標設定","D":"降低政府法規要求"},"answer":"B","source":"115年第2次官方考題","source_num":40,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qce7eaa6ee202"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於「碳信用額度（Carbon Credit） 」抵換機制之運作，下列敘述何者符合其核心 概念？","options":{"A":"碳信用額度是指企業透過購買他人的排放配額（Allowance） ，來增加自身法定 的排放上限","B":"碳信用額度須代表具「外加性」之減量或移除成果，並經量化及第三方查證","C":"所有的碳信用額度皆具有相同的法律效力，國際自願市場的碳權一定可以用於 抵減國家碳稅","D":"碳信用額度僅能透過植樹造林產生，建築能效提升或製程改善等活動絕對無法 轉化為碳權"},"answer":"B","source":"115年第2次官方考題","source_num":41,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q928bfd71520d"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於我國《氣候變遷因應法》中「碳費」徵收之規定，下列何者正確？","options":{"A":"碳費徵收對象依產業部門別分階段開徵，依序涵蓋服務、製造及運輸等部門","B":"碳費收入應全數繳入國庫，作為一般公共支出用途","C":"事業提出自主減量計畫並達成目標者，得申請適用優惠費率","D":"碳費之徵收與管理由經濟部能源主管機關負責執行"},"answer":"C","source":"115年第2次官方考題","source_num":42,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"qb4f6217362aa"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於臺灣碳權交易所（Taiwan Carbon Solution Exchange, TCX）之功能，下列敘述 何者最符合現階段之政策定位？","options":{"A":"負責辦理國內企業溫室氣體盤查、查驗及查證結果之審核與證書核發作業","B":"提供國內碳權額度及國際高品質碳權之交易撮合平台","C":"規定所有上市櫃公司均須定期進場交易碳權，以履行企業法定減碳責任","D":"受環境部委託辦理碳費徵收、收入管理及相關費用分配等行政業務"},"answer":"B","source":"115年第2次官方考題","source_num":43,"exam":"115年第2次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"qb2d2589ebc49"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於 ISO 14064-1 與 ISO 14068-1 之關係，下列敘述何者正確？","options":{"A":"ISO 14064-1 用於量化組織溫室氣體排放，ISO 14068-1 用於規範碳中和之實施 要求","B":"ISO 14064-1 用於執行碳抵換作業，ISO 14068-1 用於能源效率評估","C":"ISO 14064-1 用於產品碳足跡計算，ISO 14068-1 用於規範碳中和之實施要求","D":"ISO 14064-1 用於碳權交易管理，ISO 14068-1 用於能源效率評估"},"answer":"A","source":"115年第2次官方考題","source_num":44,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qdb069c3c4e5b"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"企業購買再生能源憑證（如 T-REC）後，主要可用於下列何項碳管理用途？","options":{"A":"消除所有產品排放","B":"降低所有直接排放","C":"取代能源效率改善","D":"認列再生能源抵減量"},"answer":"D","source":"115年第2次官方考題","source_num":45,"exam":"115年第2次官方考題","explanation":"","category":"能源與減碳技術","id":"q3c739860ab68"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據 ISO 14068-1：2023，為何 2020 年以前產生的碳權不被推薦使用？","options":{"A":"該碳權之適用範圍有限，僅可用於特定排放類別","B":"該碳權供給充足，因此無需優先使用","C":"碳權品質可能不佳且距離使用年度超過五年","D":"該碳權市場價格較高，導致使用成本增加"},"answer":"C","source":"115年第2次官方考題","source_num":46,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qf9bd4d97b8b6"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"在執行碳中和管理計畫過程中，下列何者屬於「即使完成碳中和宣告，仍不會因 此改變之數據」？","options":{"A":"溫室氣體盤查之結果數據","B":"企業核發之碳信用額度","C":"碳抵換額度之計算結果","D":"企業財務與經濟效益之報告"},"answer":"A","source":"115年第2次官方考題","source_num":47,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q140c3041af9e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"某企業欲宣告碳中和，根據 ISO 14068-1，下列哪項做法最有可能不符合標準要 求？","options":{"A":"全面以碳權抵換達成碳中和","B":"同時減少 Scope 1 與 Scope 2 排放","C":"將碳中和計畫書與年度永續報告書同步對外公開透明","D":"完成減量規劃後，就剩餘排放採用符合要求之碳權抵換"},"answer":"A","source":"115年第2次官方考題","source_num":48,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q9165046de24d"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"某電子商務公司擬針對其「快遞服務」宣告碳中和。根據 ISO 14068-1，關於其邊 界設定，下列何者正確？","options":{"A":"僅需包含該公司自有辦公室與自有物流車輛之 Scope 1 與 Scope 2 排放量","B":"考量到數據獲取困難，所有委外第三方物流車隊產生之排放量應一律排除","C":"應包含該快遞服務從收件、運輸、集貨至交付給客戶之完整生命週期內顯著的 排放量","D":"只要該公司已達成「組織型」碳中和，則其旗下所有服務自動視為達成邊界設 定"},"answer":"C","source":"115年第2次官方考題","source_num":49,"exam":"115年第2次官方考題","explanation":"","category":"碳足跡、LCA與碳標籤","id":"q40cf03acc2c7"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據 ISO 14068-1 有關碳中和之要求，組織於使用碳權進行抵換時，須確認碳權 具備「外加性（Additionality） 」 。下列何者最符合外加性之意涵？","options":{"A":"該減量專案必須屬於法規強制執行事項，以確保其執行過程符合相關法令要 求","B":"該減量專案必須是因為缺乏碳權機制的財務支持下發生","C":"外加性是指該專案在原有的減量目標之外，又多增加了 1～1.5 倍的植樹數量","D":"係指該碳權額度可以在多個不同的國際平台重複賣出，增加市場流動性 《以下空白》"},"answer":"B","source":"115年第2次官方考題","source_num":50,"exam":"115年第2次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qb88527858be6"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據《溫室氣體排放量盤查登錄及查驗管理辦法》 ，下列何者最符合盤查、登錄及 查驗三者之關係？","options":{"A":"查驗完成後，即可免辦盤查、登錄及後續申報","B":"完成盤查登錄程序後，即視為完成查驗作業","C":"盤查、登錄及查驗均有法定程序，應依法辦理","D":"查驗制度僅適用產品碳足跡，不適用組織盤查作業"},"answer":"C","source":"115年第2次官方考題","source_num":1,"exam":"115年第2次官方考題","explanation":"","category":"盤查制度、法規與流程","id":"q0d0d550885a5"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"組織型溫室氣體盤查在排放量計算中，下列哪一項屬於「活動數據」？","options":{"A":"全球暖化潛勢（GWP）","B":"碳排放量","C":"燃料使用量","D":"地區電力排放係數"},"answer":"C","source":"115年第2次官方考題","source_num":2,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"q0a6c9b735f92"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某公司完成 2025 年度溫室氣體盤查，排放量經計算為 18,625.56743tCO₂e。依規定 登錄時，應填列為何？","options":{"A":"18,625.56tCO₂e","B":"18,625.567tCO₂e","C":"18,625.5675tCO₂e","D":"18,626tCO₂e"},"answer":"B","source":"115年第2次官方考題","source_num":3,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"q9d7ba222073c"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"進行組織型溫室氣體盤查時，若燃料使用量缺乏直接量測數據，而企業須採用估 算方式取得活動數據，下列何者最符合資料品質管理原則？","options":{"A":"當無法取得實際量測數據時，可採用未具明確來源之估計值，以完成排放量計 算權","B":"使用上游供應商提供的預估量","C":"使用能反映實際活動的替代性數據並說明假設","D":"引用同業或同產業之平均數據，以確保與其他企業之盤查結果具有一致性"},"answer":"C","source":"115年第2次官方考題","source_num":4,"exam":"115年第2次官方考題","explanation":"","category":"數據品質與不確定性","id":"qf5300c5ad105"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某上市櫃公司僅受金管會永續資訊揭露規範，其組織邊界設定方式應如何選擇？","options":{"A":"須使用營運控制權法","B":"須使用股權比例分攤","C":"須使用財務控制權法","D":"營運控制權法或股權比例法皆可"},"answer":"D","source":"115年第2次官方考題","source_num":5,"exam":"115年第2次官方考題","explanation":"","category":"組織與報告邊界","id":"q3c718d16f7c8"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在組織推動溫室氣體盤查的實務流程中，通常首先由高階主管指派盤查推動小 組，而非直接由工程師進行排放量計算，其主要原因為何？","options":{"A":"工程技術人員通常僅具備設備操作經驗，未必具備完整之溫室氣體盤查專業知 識","B":"溫室氣體盤查涉及多部門之活動數據蒐集，須透過高階主管支持以促進跨部門 合作","C":"高階主管須親自參與各項活動數據計算，以確保最終盤查結果之正確性與完整 性","D":"現行法規規定溫室氣體盤查工作僅能由管理階層執行，工程技術人員不得參與 相關作業"},"answer":"B","source":"115年第2次官方考題","source_num":6,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"qe4f18cf7e7b9"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於事業執行溫室氣體排放量盤查的六步驟作業流程（1.盤查資料保存、2.邊界設 定、3.數據品質管理、4.排放源鑑別、5.排放量清冊及盤查報告書、6.排放量計 算 ） ，下列何者為正確之盤查執行程序？","options":{"A":"243651","B":"246315","C":"231465","D":"234561"},"answer":"B","source":"115年第2次官方考題","source_num":7,"exam":"115年第2次官方考題","explanation":""," 定盤查邊界？","options":{"A":"因共用設施位於甲公司圍牆範圍內，故乙公司於該廠區所產生之所有排放均應 納入甲公司盤查","B":"應依工廠登記證界定盤查邊界，無法區分時應依協議或持分比例分攤排放","C":"共用設施之排放歸屬不易界定，因此甲公司僅需盤查自有辦公室及生產設備之 排放即可","D":"因兩家公司共同使用同一廢水處理設施，故應由甲、乙兩家公司合併申報並視 為單一排放源管理"},"answer":"B","source":"115年第2次官方考題","source_num":12,"exam":"115年第2次官方考題","explanation":"","category":"組織與報告邊界","id":"q82402994eb1e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某石化廠將廠內廢水處理設施及其操作人員全權委由專業環保公司管理，但該設 施位於石化廠圍牆內，產權仍屬石化廠，且水電費亦由石化廠支付。若石化廠採 用「營運控制權法」設定組織邊界，則該廢水處理場產生之甲烷（CH₄）逸散排放 應如何界定？","options":{"A":"應列為石化廠之類別一排放，因為石化廠擁有營運控制權且承擔營運風險","B":"應列為環保公司之類別一排放，而石化廠則列為類別四之間接排放","C":"應列為石化廠之類別五排放，視為委外處理營運廢棄物所產生之排放","D":"應由石化廠與環保公司共同認列，並分別列入雙方之類別三排放"},"answer":"A","source":"115年第2次官方考題","source_num":13,"exam":"115年第2次官方考題","explanation":"","category":"排放源與類別判定","id":"q1ea6b01922a4"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"根據溫室氣體盤查指引，若百貨公司或鐵路車站之盤查邊界內設有進駐餐廳或商 店，且該進駐單位未辦理獨立商業登記時，下列何者為正確之處理方式？","options":{"A":"該餐廳非由百貨公司或車站營運，因此不納入盤查","B":"百貨公司或鐵路車站盤查時，仍應將該餐廳納入其盤查邊界","C":"由該進駐單位自行向環境部申請另一個管制編號辦理盤查","D":"盤查該餐廳的用電量，不需考慮其瓦斯燃燒之直接排放"},"answer":"B","source":"115年第2次官方考題","source_num":14,"exam":"115年第2次官方考題","explanation":"","category":"組織與報告邊界","id":"qfc5009a257f5"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某公司 2 位員工出差拜訪客戶。員工甲騎乘機車 4 公里至捷運站，員工乙駕駛自用 車 4 公里至同一捷運站；兩人隨後共同搭乘捷運 15 公里，再轉乘公車 6 公里至目 的地，最後步行至客戶公司（步行碳排放量不計） 。依下表交通運具排放係數計 算，請問此次兩位員工單趟出差共產生多少碳排放量？","options":{"A":"2.9608kgCO₂e","B":"2.5006kgCO₂e","C":"2.3608kgCO₂e","D":"1.9006kgCO₂e"},"answer":"A","source":"115年第2次官方考題","source_num":15,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"q7db602916264","figure":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAO/ArUDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAwQHAgEI/8QAWxAAAQMDAwEEBAgKBgcFBwEJAQIDBAAFEQYSITEHEyJBFBUyURZWYXF1k5TTIzU2VYGxs7TR0jNCUpGVoSQ0U2JydJJDVMHh8AgXJXOEstRjgqKjJvGDp 池逸散 CH₄排放數為 3.825 公斤 CH₄ ／人年，本次 盤查 GWP 採用 IPCC AR5 版本，CH₄之 GWP 為 28，請問某公司年度化糞池逸散 量為多少公噸二氧化碳當量？","options":{"A":"0.0041895","B":"4.8195","C":"481.95","D":"4819.5"},"answer":"B","source":"115年第2次官方考題","source_num":16,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"qc91e4735f5e0"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"進行溫室氣體排放量化時，若缺乏燃料實際重量資料，僅取得採購發票金額及平 均單價，下列何者最符合活動數據管理原則？","options":{"A":"依採購發票金額及平均單價推估燃料用量，並於報告中說明估算方法及不確定 性","B":"依同期間其他月份之平均燃料用量估算，但因屬估算資料，可免揭露估算依 據","C":"依採購發票金額推估燃料用量，並於查證完成後再決定是否補充相關佐證資 料","D":"以歷年燃料平均使用量替代當年度活動數據，只要排放趨勢一致即可作為量化 依據"},"answer":"A","source":"115年第2次官方考題","source_num":17,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"qa03575892861"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某工廠鍋爐以木屑（生質燃料）作為燃料。依據溫室氣體盤查原則，在計算組織 直接溫室氣體排放總量（CO₂e）時，下列哪一項排放量不應加總於直接排放總 量，而應另行揭露？","options":{"A":"木屑燃燒產生之甲烷（CH₄）排放量","B":"木屑燃燒產生之氧化亞氮（N₂O）排放量","C":"木屑燃燒產生之生質二氧化碳（CO₂）排放量","D":"木屑燃燒所產生之其他直接溫室氣體排放量"},"answer":"C","source":"115年第2次官方考題","source_num":18,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"qff64164d5c22"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"企業進行溫室氣體盤查時，若排放來源為生物質分解產生之甲烷，應如何處理 GWP 係數？","options":{"A":"套用二氧化碳排放係數計算","B":"視為能源使用排放不需區分來源","C":"僅需記錄甲烷量不需換算排放量","D":"依生物甲烷對應係數進行換算"},"answer":"D","source":"115年第2次官方考題","source_num":19,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"q3d44bb0961bf"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某工廠進行組織型溫室氣體盤查，已知： 一、製程使用天然氣排放 600tCO₂e。 二、外購電力排放 400tCO₂e。 三、出租予第三方獨立營運之倉儲，其用電排放 50tCO₂e。 四、員工公務車油耗排放 20tCO₂e。 若工廠採用「營運控制權法」設定組織邊界，下列何者為其應認列之類別一與類 別二排放總量？","options":{"A":"應納入所有排放來源，類別一與二合計 1,070tCO₂e","B":"應排除第三方獨立營運倉儲之用電排放，類別一與二合計 1,020tCO₂e","C":"應僅計入固定燃燒源及外購電力，類別一與二合計 1,000tCO₂e","D":"應排除員工公務車之油耗排放，類別一與二合計 1,050tCO₂e"},"answer":"B","source":"115年第2次官方考題","source_num":20,"exam":"115年第2次官方考題","explanation":"","category":"組織與報告邊界","id":"q33c4dc4f939c"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某企業年度溫室氣體排放量為 2,000tCO₂e，其中 100tCO₂e 來自生物質燃料燃燒產 生之 CO₂。在溫室氣體報告書中，該 100tCO₂e 應如何處理？","options":{"A":"納入類別一總排放量計算，並與化石燃料排放合併揭露","B":"以生物來源 CO₂形式單獨揭露，但不納入總排放量加總計算","C":"因生質碳具有碳中性特性，該排放量可免於報告書中揭露","D":"併入類別二能源間接排放，作為外購能源排放之一部分"},"answer":"B","source":"115年第2次官方考題","source_num":21,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"q1b2bff019e83"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於組織於 ISO 14064-1：2018 外部查證前應準備之文件，下列何者正確？","options":{"A":"ISO 14001 驗證文件","B":"內部管理規程、組織架構及內部稽核結果","C":"製程資訊、排放係數資料及合格人員名單","D":"溫室氣體盤查清冊、盤查報告書及管理程序書"},"answer":"D","source":"115年第2次官方考題","source_num":22,"exam":"115年第2次官方考題","explanation":"","category":"ISO 14064-1與查證","id":"qb7e0956928cc"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於溫室氣體盤查報告書應揭露之內容，下列何者不包含於其中？","options":{"A":"基準年或其他過去的溫室氣體盤查清冊之任何重新計算","B":"說明先前使用的量化方法之任何變更之理由","C":"說明歷次過去的溫室氣體數據負責單位及負責人之任何改變","D":"說明將任何重大溫室氣體源或溫室氣體匯排除量化之理由"},"answer":"C","source":"115年第2次官方考題","source_num":23,"exam":"115年第2次官方考題","explanation":"","category":"盤查制度、法規與流程","id":"q307fc0fe0faf"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某企業盤查時僅納入主要生產設備排放，未考量冷媒逸散與公務車使用。此作法 主要違反溫室氣體清冊之何項原則？","options":{"A":"完整性","B":"相關性","C":"一致性","D":"透明度"},"answer":"A","source":"115年第2次官方考題","source_num":24,"exam":"115年第2次官方考題","explanation":"","category":"排放源與類別判定","id":"q4e7d7aa99913"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據溫室氣體盤查報告書之基本內容要求，某公司盤查報告書目前包含下列章 節： 一、公司基本資料 二、盤查邊界設定 三、排放量計算 四、查驗結果 五、減量規劃 若欲使其內容更趨完整，下列何者最應補入？","options":{"A":"財務績效、供應商管理、客戶滿意度","B":"排放源鑑別、數據品質管理、其他主管機關規定事項","C":"員工訓練紀錄、減碳宣導活動、永續獎項","D":"碳權交易紀錄、碳中和聲明、產品碳足跡"},"answer":"B","source":"115年第2次官方考題","source_num":25,"exam":"115年第2次官方考題","explanation":"","category":"數據品質與不確定性","id":"qa4df228d7bce"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於 ISO 14064-1：2018 規定之溫室氣體盤查報告內容，下列何者係用以界定應盤 查之排放？","options":{"A":"界定重大排放準則","B":"文件報告期間資訊","C":"生產製程排放源","D":"組織盤查過程說明"},"answer":"A","source":"115年第2次官方考題","source_num":26,"exam":"115年第2次官方考題","explanation":"","category":"盤查制度、法規與流程","id":"q707f34f8cb6e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據我國環境部《溫室氣體排放量盤查登錄管理辦法》之規定，應辦理盤查登錄 之事業，其盤查、登錄及查證相關之原始資料、計算過程及證明文件，至少應保 存多久？","options":{"A":"3 年","B":"4 年","C":"5 年","D":"6 年"},"answer":"D","source":"115年第2次官方考題","source_num":27,"exam":"115年第2次官方考題","explanation":"","category":"盤查制度、法規與流程","id":"q79e7aa1341b2"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在執行產品碳足跡盤查的數據檢核程序中，關於資料品質管理原則的作法，下列 何者通常不符合？","options":{"A":"透過質量平衡（Mass Balance）檢核投入與產出資料，並評估是否落於合理誤 差範圍","B":"確認活動數據以實際使用量為原則，並依庫存變動修正領用量後進行計算","C":"保存電費單、採購單及領料紀錄等佐證文件，以利後續查證及追溯","D":"盤查資料可與 ERP 或原始單據存在差異，只要經內部人員說明原因即可接受"},"answer":"D","source":"115年第2次官方考題","source_num":28,"exam":"115年第2次官方考題","explanation":"","category":"數據品質與不確定性","id":"qbbaab68b8109"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於產品生命週期終結階段納入產品碳足跡（Carbon Footprint of Product, CFP）研 究之規定，下列何者不屬於生命終結階段之作業？","options":{"A":"有機回收（如堆肥與厭氧消化）","B":"製程剩餘原料或廢棄物之委外處理","C":"掩埋處理及掩埋場維護與甲烷排放管理","D":"焚化處理及底渣分類再利用作業"},"answer":"B","source":"115年第2次官方考題","source_num":29,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q8bac0da072cb"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據 ISO 14067：2018 標準要求，於進行數據量化時，排放源計算至標的產品之 分配原則，其引用優先順序為何？","options":{"A":"避免分配（Avoid Allocation）→物理分配法（Physical Allocation）→經濟分配 法（Economic Allocation）","B":"物理分配法（Physical Allocation）→經濟分配法（Economic Allocation）→避免 分配（Avoid Allocation）","C":"經濟分配法（Economic Allocation）→物理分配法（Physical Allocation）→避免 分配（Avoid Allocation）","D":"避免分配（Avoid Allocation）經濟分配法（Economic Allocation）→物理分配法 （Physical Allocation）"},"answer":"A","source":"115年第2次官方考題","source_num":30,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qeadb0992e906"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在計算產品碳足跡（Carbon Footprint of Product, CFP）時，為何不能直接使用組織 型碳盤查（GHG）的電力排碳係數？","options":{"A":"因為 GHG 係數僅計算發電時的排碳","B":"因為 GHG 係數包含原料開採的排碳","C":"因為 GHG 係數專門用於計算水資源","D":"因為 GHG 係數已排除電網輸配損耗"},"answer":"A","source":"115年第2次官方考題","source_num":31,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qd553a42a0865"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於生命週期評估（Life Cycle Assessment, LCA）中「功能單位（Functional Unit） 」之主要作用，下列何者正確？","options":{"A":"規定產品在市場上必須具備之銷售價格基準","B":"提供量化基準，以比較相同服務下產品環境負荷","C":"統計工廠員工工時與碳排放之關聯程度分析","D":"用於換算產品重量與每單位體積碳排放關係"},"answer":"B","source":"115年第2次官方考題","source_num":32,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q8a0af9df6792"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於生命週期評估（Life Cycle Assessment, LCA）之系統邊界設定，下列何者通常 不需納入產品生命週期評估範圍？","options":{"A":"生產設備的維運保養","B":"輔助性物料之製造","C":"產品的研發","D":"生產階段的照明與空調"},"answer":"C","source":"115年第2次官方考題","source_num":33,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q05062ad703c2"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於生命週期評估（Life Cycle Assessment, LCA）中「使用階段」之溫室氣體排 放，下列何種產品通常於該階段排放占比最高？","options":{"A":"寶特瓶裝礦泉水","B":"電冰箱或大型中央空調設備","C":"傳統鋼鐵建材或預拌混凝土","D":"木造家具或再生紙張"},"answer":"B","source":"115年第2次官方考題","source_num":34,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qe6b91c0a6418"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於產品類別規則（PCR）之適用原則及國際通用性，下列何者正確？","options":{"A":"若同一產品已有適用之 PCR，企業仍可自行改採其他產品類別之PCR，以提升 不同產品間之比較性","B":"依 ISO 14067：2018 規定，產品已有適用之 PCR 時，執行產品碳足跡量化原則 上應依該 PCR 辦理","C":"產品依我國環境部核定之 PCR 完成碳足跡查證後，即可直接作為各國產品環境 宣告之共同依據","D":"PCR 可由企業自行制定並直接採用，不須經公開審查或利害關係人參與程序"},"answer":"B","source":"115年第2次官方考題","source_num":35,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q88e4baffc3bb"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"國內某公司擬向環境部申請產品碳足跡標籤，於碳足跡資訊網查得該產品對應之 CCC Code 已有國內產品類別規則（PCR） ，但部分規定與產品特性不符。下列何 者為較適當之處理方式？","options":{"A":"引用較符合產品特性的國外 PCR，完成第三方查證後即可據以申請國內產品碳 標籤","B":"依據「碳足跡產品類別規則訂定、引用及修訂指引」申請修訂該份國內 PCR","C":"使用 ISO 14067：2018 進行盤查，提出產品標籤申請時需加註說明該 PCR 為何 不適用","D":"申請作廢該份國內 PCR，重新制定屬於自家產品的PCR"},"answer":"B","source":"115年第2次官方考題","source_num":36,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q0038022d3885"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據 CNS 14027《環境標誌與宣告－產品類別規則（PCR）之制定》 ，關於產品類 別規則（PCR）應包含之必要內容，下列何者不正確？","options":{"A":"功能或宣告單位","B":"系統邊界、資料品質要求及生命週期各階段之納入原則","C":"多重產品系統之分配原則","D":"碳標籤的標示方法"},"answer":"D","source":"115年第2次官方考題","source_num":37,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q9f08eadd81c7"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據產品類別規則（PCR）之生命週期系統邊界，下列何者通常不屬於產品「製 造階段」應納入評估之流程？","options":{"A":"能資源與電力之消耗","B":"製程用水供應","C":"製程廢棄物處理","D":"各原料到製造工廠之運輸"},"answer":"D","source":"115年第2次官方考題","source_num":38,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qc6120208e6dc"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於在臺灣申請碳足跡標籤與使用碳足跡產品類別規則（CFP-PCR）上，下列敘 述何者不正確？","options":{"A":"若不申請碳足跡標籤則可依據 ISO 14067：2018 進行碳足跡盤查與計算即可， 不一定需要依據 PCR","B":"商品製造商、提供該類服務業者或產品業者所組成之同業公（協、商）會、政 府機關（構）均可擔任 PCR 制定者","C":"要向環境部申請碳足跡標籤或碳足跡減量標籤者，可依使用需要決定引用國內 或國外 PCR","D":"PCR 制定流程的準備階段，需將草案於網路上預告 14 日以上，供利害相關者 審閱"},"answer":"C","source":"115年第2次官方考題","source_num":39,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qf42b8cc5512f"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"某食品公司辦理蛋糕產品碳足跡（CFP）盤查。依國內CFP-PCR 對一級數據 （Primary Data）蒐集之要求，其製造階段排放僅占「原料取得階段與製造階段」 總排放量之 5%。下列何者最符合數據蒐集要求？","options":{"A":"應優先取得排放貢獻最高之原料供應商一級數據，且其數據必須經第三方查證 後始得採用","B":"應取得上游供應商之一級數據，使製造階段與供應商一級數據合計至少達總排 放量 5%，即可符合要求","C":"應取得上游供應商之一級數據，使製造階段與供應商一級數據合計至少達原料 取得與製造階段總排放量 10%","D":"若無法取得全部供應商資料，僅需蒐集供貨量占比超過 75%之供應商一級數 據，即可視為符合要求"},"answer":"C","source":"115年第2次官方考題","source_num":40,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q8e0f92d29015"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"若某產品的碳足跡計算中，某輔助材料碳排放量極低（低於 1%） ，此時可依據何 種原則予以排除？","options":{"A":"依據切斷規則原則予以排除","B":"依據分配計算原則予以排除","C":"依據功能單位原則予以排除","D":"依據數據品質原則予以排除"},"answer":"A","source":"115年第2次官方考題","source_num":41,"exam":"115年第2次官方考題","explanation":"","category":"排放量計算與係數","id":"q2b938f5e112e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡（CFP）採用「搖籃到墳墓（Cradle to Grave） 」系統邊界時，下列何者 通常不納入碳足跡盤查範圍？","options":{"A":"消費者往返零售通路購買產品所產生之交通排放","B":"原料自供應商運送至製造工廠之物流運輸排放","C":"製造產品所投入之原物料及相關製程排放","D":"產品使用階段所消耗之能源或其他資源排放"},"answer":"A","source":"115年第2次官方考題","source_num":42,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q880a637881c1"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡（CFP）生命終期（End-of-life）階段進行量化時，下列何者通常為主 要活動數據或資訊來源？","options":{"A":"廢棄之產品或包裝材重量","B":"製程廢棄物處理方式","C":"產品或包裝材清運距離","D":"製造產品時經過哪些程序"},"answer":"A","source":"115年第2次官方考題","source_num":43,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qb63e113ac7c0"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於產品碳足跡（CFP）系統邊界之規範，下列何者通常需納入 B2C 產品碳足跡 計算，但 B2B 產品通常可不納入或視情境決定？","options":{"A":"原料取得階段的相關溫室氣體排放","B":"產品生產製造的相關溫室氣體排放","C":"零組件運輸至工廠的溫室氣體排放","D":"產品使用階段的相關溫室氣體排放"},"answer":"D","source":"115年第2次官方考題","source_num":44,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q777dc786479e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於商品（Goods）與服務（Services）之生命週期製程地圖（Process Map） ，下列 哪一階段在兩者間通常無明顯差異？","options":{"A":"製造階段","B":"配送銷售階段","C":"使用階段","D":"廢棄處理"},"answer":"D","source":"115年第2次官方考題","source_num":45,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q35872a880a41"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於產品碳足跡（CFP）研究中，若相同產品採用不同的系統邊界進行量化，最 可能對研究結果造成下列何種影響？","options":{"A":"排放係數可自動修正系統邊界差異，使結果維持一致","B":"排放結果可能被高估或低估","C":"功能單位通常須重新定義，才能消除不同系統邊界造成之量化差異","D":"系統邊界僅影響資料蒐集成本，不影響量化結果"},"answer":"B","source":"115年第2次官方考題","source_num":46,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qdc82b5962281"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於產品碳足跡結果闡釋（Interpretation）階段，下列何者為其主要目的？","options":{"A":"檢視碳足跡結果之完整性與一致性，並確認資料是否符合研究目的","B":"評估結果完整性、敏感度及一致性，並提出結論與建議","C":"比較各生命週期階段排放量，僅以排放最高之階段作為改善重點","D":"依量化結果直接決定產品售價及節能改善方案，作為最終研究結論"},"answer":"B","source":"115年第2次官方考題","source_num":47,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q8bd372d2e383"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"企業欲依 ISO 14067：2018 進行產品碳足跡比較，下列何項條件最重要？","options":{"A":"確保功能單位與系統邊界一致","B":"優先選擇排放量較低產品比較","C":"僅比較製造階段能源使用量","D":"依企業規模調整計算方法"},"answer":"A","source":"115年第2次官方考題","source_num":48,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"qf31b8e5f836c"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據 ISO 14067：2018 產品碳足跡報告揭露原則，下列何者資訊通常不須單獨揭 露？","options":{"A":"產品所含之零件的碳排放量","B":"來自飛機運輸的碳排放量","C":"源自化石的淨溫室氣體量","D":"源自生物的淨溫室氣體量"},"answer":"A","source":"115年第2次官方考題","source_num":49,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q35a8cfd1d10a"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在產品生命週期的碳排評估中，若企業購買了碳權，是否可以直接將該產品的碳 足跡計算為零？","options":{"A":"不可以，計算碳足跡不允許應用碳抵換","B":"可以，只要碳權經過第三方機構認證","C":"不可以，除非碳權來自於植樹造林專案","D":"可以，購買碳權即可抵消所有的碳排 《以下空白》"},"answer":"A","source":"115年第2次官方考題","source_num":50,"exam":"115年第2次官方考題","explanation":"","category":"產品碳足跡與ISO 14067","id":"q62d57076f9f4"}];
const STORE_KEY='netzero_morandi_practice_v2';
let state={done:{},correct:0,answered:0};try{state={...state,...JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}}catch(e){}
const save=()=>{localStorage.setItem(STORE_KEY,JSON.stringify(state));updateStats();};
const subjects=[...new Set(QUESTIONS.map(q=>q.subject))];
const catsFor=s=>[...new Set(QUESTIONS.filter(q=>s==='all'||q.subject===s).map(q=>q.category))].sort();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fillSelect(sel,items,allLabel){sel.innerHTML=`<option value="all">${allLabel}</option>`+items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
['browseSubject','quizSubject','voiceSubject'].forEach(id=>fillSelect(document.getElementById(id),subjects,'全部考科'));
function refreshCat(which){const s=document.getElementById(which+'Subject').value;fillSelect(document.getElementById(which+'Category'),catsFor(s),'全部大類')}
refreshCat('browse');refreshCat('quiz');refreshCat('voice');document.getElementById('browseSubject').onchange=()=>{refreshCat('browse');renderBrowse()};document.getElementById('quizSubject').onchange=()=>refreshCat('quiz');document.getElementById('voiceSubject').onchange=()=>refreshCat('voice');
function updateStats(){const done=Object.keys(state.done||{}).length,total=QUESTIONS.length,pct=total?Math.round(done/total*100):0;document.getElementById('totalStat').textContent=total+' 題';document.getElementById('doneStat').textContent=pct+'%';document.getElementById('remainStat').textContent=(total-done)+' 題';document.getElementById('accStat').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'-';renderProgress()}
function filterBrowse(){const q=document.getElementById('search').value.trim().toLowerCase(),s=document.getElementById('browseSubject').value,c=document.getElementById('browseCategory').value;return QUESTIONS.filter(x=>(s==='all'||x.subject===s)&&(c==='all'||x.category===c)&&(!q||(x.stem+' '+Object.values(x.options).join(' ')+' '+x.source).toLowerCase().includes(q)))}
function qHtml(q,i){const practiced=state.done[q.id];return `<article class="qcard"><div class="qhead"><div class="qstem">${i+1}. ${esc(q.stem)}</div><button class="tiny-btn" onclick="this.closest('.qcard').classList.toggle('show-answer')">顯示答案</button></div><div class="badges"><span class="badge">${esc(q.category)}</span><span class="badge exam">${esc(q.source)}</span>${practiced?'<span class="badge">已練習</span>':''}</div>${q.figure?`<img class="figure" src="${q.figure}" alt="題目圖表">`:''}<div class="options">${'ABCD'.split('').map(k=>`<div class="option"><b>${k}.</b> ${esc(q.options[k])}</div>`).join('')}</div><div class="answer-box"><b>答案：${q.answer}</b>${q.explanation?`<div>${esc(q.explanation)}</div>`:''}</div><div class="source-note">來源：${esc(q.source)}${q.source_num?'・第 '+q.source_num+' 題':''}${q.also_sources?.length?'；亦見 '+q.also_sources.map(esc).join('、'):''}</div></article>`}
function renderBrowse(){const arr=filterBrowse(),root=document.getElementById('browseRoot');if(!arr.length){root.innerHTML='<div class="empty">沒有符合條件的題目。</div>';return}let out='';for(const s of subjects){const sq=arr.filter(q=>q.subject===s);if(!sq.length)continue;out+=`<section class="subject-block"><div class="subject-title"><h2>${esc(s)}</h2><span>${sq.length} 題</span></div>`;for(const c of catsFor(s)){const cq=sq.filter(q=>q.category===c);if(!cq.length)continue;out+=`<details class="category" open><summary><span>${esc(c)}</span><span>${cq.length} 題</span></summary><div class="qgrid">${cq.map((q,i)=>qHtml(q,i)).join('')}</div></details>`}out+='</section>'}root.innerHTML=out}
document.getElementById('search').oninput=renderBrowse;document.getElementById('browseCategory').onchange=renderBrowse;document.getElementById('clearSearch').onclick=()=>{document.getElementById('search').value='';document.getElementById('browseSubject').value='all';refreshCat('browse');renderBrowse()};
let quizList=[],qi=0,locked=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
document.getElementById('startQuiz').onclick=()=>{const s=document.getElementById('quizSubject').value,c=document.getElementById('quizCategory').value,count=document.getElementById('quizCount').value;let pool=QUESTIONS.filter(q=>(s==='all'||q.subject===s)&&(c==='all'||q.category===c)&&!state.done[q.id]);if(!pool.length){document.getElementById('quizArea').innerHTML='<div class="quiz-box"><div class="notice">這個範圍已全部練習完成，沒有重複題可出。若要重新練習，請至「練習進度」重置紀錄。</div></div>';return}pool=shuffle(pool);quizList=count==='all'?pool:pool.slice(0,Math.min(Number(count),pool.length));qi=0;showQuiz()};
function showQuiz(){if(qi>=quizList.length){document.getElementById('quizArea').innerHTML=`<div class="quiz-box"><h2>本次測驗完成</h2><p>已完成 ${quizList.length} 題，這些題目已記錄為「已練習」，後續不會再次出題。</p><button class="btn" onclick="document.getElementById('startQuiz').click()">再出未練習題</button></div>`;updateStats();return}const q=quizList[qi];locked=false;document.getElementById('quizArea').innerHTML=`<div class="quiz-box"><div class="quiz-meta"><span>${qi+1} / ${quizList.length}</span><span>${esc(q.subject)}・${esc(q.category)}</span></div><h2 style="font-size:20px">${esc(q.stem)}</h2>${q.figure?`<img class="figure" src="${q.figure}" alt="題目圖表">`:''}<div>${'ABCD'.split('').map(k=>`<button class="quiz-option" data-k="${k}"><b>${k}.</b> ${esc(q.options[k])}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="quiz-actions"><button id="nextQ" class="btn hidden">下一題</button></div></div>`;document.querySelectorAll('.quiz-option').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.k));document.getElementById('nextQ').onclick=()=>{qi++;showQuiz()}}
function answerQuiz(k){if(locked)return;locked=true;const q=quizList[qi],ok=k===q.answer;state.done[q.id]={correct:ok,at:Date.now()};state.answered=(state.answered||0)+1;if(ok)state.correct=(state.correct||0)+1;save();document.querySelectorAll('.quiz-option').forEach(b=>{b.disabled=true;if(b.dataset.k===q.answer)b.classList.add('correct');else if(b.dataset.k===k)b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=ok?`答對了。答案：<b>${q.answer}</b>`:`答錯了。正確答案：<b>${q.answer}</b>`;document.getElementById('nextQ').classList.remove('hidden')}

let voiceList=[],vi=0,voiceSpeaking=false,voicePaused=false,voiceMarked=false,voiceToken=0,voiceAutoRunning=false,voiceAdvanceTimer=null;
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
function cleanSpeech(t){return String(t||'').replace(/CO₂/g,'二氧化碳').replace(/CH₄/g,'甲烷').replace(/N₂O/g,'氧化亞氮').replace(/tCO₂e/gi,'公噸二氧化碳當量').replace(/kgCO₂e/gi,'公斤二氧化碳當量').replace(/CO2e/gi,'二氧化碳當量').replace(/Scope\s*1/gi,'範疇一').replace(/Scope\s*2/gi,'範疇二').replace(/Scope\s*3/gi,'範疇三').replace(/ISO\s*14064-1/gi,'I S O 一四零六四之一').replace(/ISO\s*14067/gi,'I S O 一四零六七').replace(/UNFCCC/gi,'U N F C C').replace(/NDC/gi,'N D C').replace(/TCFD/gi,'T C F D').replace(/SBTi/gi,'S B T i').replace(/RE100/gi,'R E 一百').replace(/CBAM/gi,'C B A M').replace(/\s+/g,' ').trim();}
function pickZhVoice(){if(!synth)return null;const vs=synth.getVoices().filter(v=>/^zh/i.test(v.lang));if(!vs.length)return null;const score=v=>{let n=(v.name||'').toLowerCase(),x=0;if(/^zh-tw/i.test(v.lang))x+=100;if(/natural|online/.test(n))x+=40;if(/hsiaochen|曉臻|xiaoxiao|yun|雲|美佳|meijia/.test(n))x+=25;if(v.localService)x+=5;return x};return vs.sort((a,b)=>score(b)-score(a))[0]||null;}
function stopVoice(){voiceToken++;if(voiceAdvanceTimer){clearTimeout(voiceAdvanceTimer);voiceAdvanceTimer=null;}if(synth){synth.cancel();}voiceSpeaking=false;voicePaused=false;updateVoiceStatus();}
function haltVoiceSession(){voiceAutoRunning=false;stopVoice();const txt=document.getElementById('voiceStatusText');if(txt)txt.textContent='已停止';}
function updateVoiceStatus(){const dot=document.getElementById('voiceDot'),txt=document.getElementById('voiceStatusText');if(!dot||!txt)return;dot.classList.toggle('speaking',voiceSpeaking&&!voicePaused);txt.textContent=voicePaused?'已暫停':voiceSpeaking?'正在朗讀':'待命';}
function makeUtterance(text,rateAdjust=0){const u=new SpeechSynthesisUtterance(cleanSpeech(text));u.lang='zh-TW';const base=Number(document.getElementById('voiceRate')?.value||1);u.rate=Math.max(.65,Math.min(1.35,base+rateAdjust));u.pitch=1;u.volume=1;const v=pickZhVoice();if(v)u.voice=v;return u;}
function speakSegments(segments,onend){if(!synth){alert('此瀏覽器不支援語音朗讀，建議使用最新版 Chrome 或 Edge。');return;}stopVoice();const token=voiceToken;let i=0;function next(){if(token!==voiceToken)return;if(i>=segments.length){voiceSpeaking=false;voicePaused=false;updateVoiceStatus();if(onend)onend();return;}const seg=segments[i++],u=makeUtterance(seg.text,seg.rateAdjust||0);u.onstart=()=>{if(token!==voiceToken)return;voiceSpeaking=true;voicePaused=false;updateVoiceStatus()};u.onend=()=>{if(token!==voiceToken)return;setTimeout(next,seg.pause??280)};u.onerror=()=>{if(token!==voiceToken)return;setTimeout(next,120)};synth.speak(u)}next();}
function speakText(text,onend){speakSegments([{text,pause:0}],onend);}
function voiceQuestionSegments(q){return [
{text:`第 ${vi+1} 題。`,pause:350,rateAdjust:-0.03},
{text:q.stem,pause:520,rateAdjust:-0.04},
{text:`選項 A。${q.options.A}`,pause:420,rateAdjust:-0.02},
{text:`選項 B。${q.options.B}`,pause:420,rateAdjust:-0.02},
{text:`選項 C。${q.options.C}`,pause:420,rateAdjust:-0.02},
{text:`選項 D。${q.options.D}`,pause:950,rateAdjust:-0.02},
{text:`答案是：${q.answer}。${q.options[q.answer]}`,pause:0,rateAdjust:-0.04}
];}
function voiceQuestionText(q){return voiceQuestionSegments(q).map(x=>x.text).join(' ');}
function markVoiceDone(q){if(voiceMarked)return;voiceMarked=true;if(!state.done[q.id]){state.done[q.id]={correct:null,at:Date.now(),mode:'voice'};save();renderBrowse();}}
function renderVoice(){
if(vi>=voiceList.length){stopVoice();voiceAutoRunning=false;document.getElementById('voiceArea').innerHTML=`<div class="voice-box"><h2>目前範圍已全部練習完成</h2><p>已連續聽完 ${voiceList.length} 題，這些題目已記錄為「已練習」。</p><button class="btn" id="voiceRestartDone">重新檢查未練習題</button></div>`;const rb=document.getElementById('voiceRestartDone');if(rb)rb.onclick=()=>document.getElementById('startVoice').click();updateStats();return;}
const q=voiceList[vi];voiceMarked=false;document.getElementById('voiceArea').innerHTML=`<div class="voice-box"><div class="quiz-meta"><span>${vi+1} / ${voiceList.length}</span><span>${esc(q.subject)}・${esc(q.category)}</span></div><div class="voice-status"><i id="voiceDot" class="voice-dot"></i><span id="voiceStatusText">${voiceAutoRunning?'準備朗讀':'已停止'}</span></div><h2 style="font-size:20px">${esc(q.stem)}</h2>${q.figure?`<img class="figure" src="${q.figure}" alt="題目圖表">`:''}<div class="options">${'ABCD'.split('').map(k=>`<div class="option"><b>${k}.</b> ${esc(q.options[k])}</div>`).join('')}</div><div id="voiceAnswer" class="voice-answer"><b>答案：${q.answer}</b><div>${esc(q.options[q.answer])}</div>${q.explanation?`<div>${esc(q.explanation)}</div>`:''}</div><div class="voice-controls"><button class="btn" id="repeatVoice">🔊 重播本題</button><button class="btn ghost" id="pauseVoice">⏸ 暫停</button><button class="btn ghost" id="resumeVoice">▶ 繼續</button><button class="btn secondary" id="stopVoiceNow">■ 停止語音</button><button class="btn ghost" id="nextVoice">跳到下一題</button></div></div>`;
const repeat=()=>{voiceAutoRunning=true;speakSegments(voiceQuestionSegments(q),()=>{markVoiceDone(q);const a=document.getElementById('voiceAnswer');if(a)a.classList.add('show');if(voiceAutoRunning){voiceAdvanceTimer=setTimeout(()=>{if(!voiceAutoRunning)return;vi++;renderVoice();},1500);}})};
document.getElementById('repeatVoice').onclick=repeat;
document.getElementById('pauseVoice').onclick=()=>{if(synth&&synth.speaking&&!synth.paused){synth.pause();voicePaused=true;updateVoiceStatus()}};
document.getElementById('resumeVoice').onclick=()=>{if(synth&&synth.paused){synth.resume();voicePaused=false;voiceSpeaking=true;updateVoiceStatus()}};
document.getElementById('stopVoiceNow').onclick=haltVoiceSession;
document.getElementById('nextVoice').onclick=()=>{markVoiceDone(q);stopVoice();vi++;if(voiceAutoRunning)renderVoice();else renderVoice()};
if(voiceAutoRunning)voiceAdvanceTimer=setTimeout(repeat,220);
}
function startVoiceSession(){haltVoiceSession();const s=document.getElementById('voiceSubject').value,c=document.getElementById('voiceCategory').value;let pool=QUESTIONS.filter(q=>(s==='all'||q.subject===s)&&(c==='all'||q.category===c)&&!state.done[q.id]);if(!pool.length){document.getElementById('voiceArea').innerHTML='<div class="voice-box"><div class="notice">這個範圍已全部練習完成，沒有未練習題可朗讀。可到「練習進度」重置紀錄。</div></div>';return}pool=shuffle(pool);voiceList=pool;vi=0;voiceAutoRunning=true;renderVoice();}
document.getElementById('startVoice').onclick=startVoiceSession;
const stopMain=document.getElementById('stopVoiceMain');if(stopMain)stopMain.onclick=haltVoiceSession;
function renderProgress(){const root=document.getElementById('progressRoot');if(!root)return;let out='<div class="progress-grid">';for(const s of subjects){const all=QUESTIONS.filter(q=>q.subject===s),done=all.filter(q=>state.done[q.id]).length,p=all.length?Math.round(done/all.length*100):0;out+=`<div><b>${esc(s.replace(/^第.科：/,''))}</b><div>${done} / ${all.length} 題（${p}%）</div><div class="bar"><i style="width:${p}%"></i></div></div>`}out+='</div><h3>各知識大類</h3><div class="progress-grid">';for(const s of subjects)for(const c of catsFor(s)){const all=QUESTIONS.filter(q=>q.subject===s&&q.category===c),done=all.filter(q=>state.done[q.id]).length,p=Math.round(done/all.length*100);out+=`<div><b>${esc(c)}</b><div>${done} / ${all.length} 題（${p}%）</div><div class="bar"><i style="width:${p}%"></i></div></div>`}out+='</div>';root.innerHTML=out}
document.getElementById('resetProgress').onclick=()=>{if(confirm('確定清除所有練習紀錄？清除後題目會重新進入未練習池。')){state={done:{},correct:0,answered:0};save();renderBrowse()}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.tab!=='voice')haltVoiceSession();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');if(b.dataset.tab==='progress')renderProgress();if(b.dataset.tab==='voice'&&!voiceAutoRunning)startVoiceSession()});
renderBrowse();updateStats();
</script></body></html>
