<script>
/* ===== Google Sheet 白名單直接比對驗證 =====
   1) 將 google_apps_script_驗證端.gs 貼到 Google Apps Script
   2) 部署為 Web App 後，把網址貼到下方 appsScriptUrl
   3) Google Sheet A 欄可放 Gmail、數字、文字或符號組合；B 欄可選填狀態
*/
window.APP_AUTH_CONFIG={
  appsScriptUrl:'https://script.google.com/macros/s/AKfycbykAWjyRNA7-5XhUmZnN1emN-wvroB83Pcy8tXYxzcgL3yF0JaW5HnbWg1r_dhqPqyLhA/exec',
  localKey:'netzero_sheet_authorized_v3'
};
(function(){
  const cfg=window.APP_AUTH_CONFIG||{};
  const gate=document.getElementById('authGate');
  const valueEl=document.getElementById('authValue');
  const statusEl=document.getElementById('authStatus');
  const verifyBtn=document.getElementById('verifyAuthValue');

  function configured(){return /^https:\/\/script\.google\.com\/macros\/s\//.test(String(cfg.appsScriptUrl||''));}
  function setStatus(msg,type){statusEl.textContent=msg;statusEl.classList.remove('ok','bad');if(type)statusEl.classList.add(type);}
  function rememberValue(value){
    try{localStorage.setItem(cfg.localKey||'netzero_sheet_authorized_v3',JSON.stringify({value:value,at:Date.now()}));}catch(e){}
  }
  function clearRemembered(){
    try{localStorage.removeItem(cfg.localKey||'netzero_sheet_authorized_v3');}catch(e){}
  }
  function getRemembered(){
    try{const raw=localStorage.getItem(cfg.localKey||'netzero_sheet_authorized_v3');if(!raw)return '';const d=JSON.parse(raw);return String((d&&d.value)||'').trim();}catch(e){return '';}
  }
  function unlock(value){
    if(value)rememberValue(value);
    document.body.classList.remove('auth-locked');
    if(gate)gate.remove();
  }
  function jsonp(params){
    return new Promise((resolve,reject)=>{
      if(!configured()){reject(new Error('尚未設定 Google Apps Script Web App URL'));return;}
      const cb='__authcb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const script=document.createElement('script');
      const timer=setTimeout(()=>{cleanup();reject(new Error('驗證服務連線逾時'));},15000);
      function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}if(script.parentNode)script.parentNode.removeChild(script);}
      window[cb]=(data)=>{cleanup();resolve(data||{});};
      const qs=new URLSearchParams({...params,callback:cb,_:Date.now()});
      script.src=cfg.appsScriptUrl+(cfg.appsScriptUrl.includes('?')?'&':'?')+qs.toString();
      script.onerror=()=>{cleanup();reject(new Error('無法連線至驗證服務'));};
      document.head.appendChild(script);
    });
  }
  async function verifyValue(){
    const value=String(valueEl.value||'').trim();
    if(!value){setStatus('請先輸入 Gmail、授權碼或其他已登錄內容。','bad');valueEl.focus();return;}
    if(!configured()){setStatus('尚未設定 Google Apps Script Web App URL，請先完成後端設定。','bad');return;}
    verifyBtn.disabled=true;setStatus('正在比對 Google Sheet 授權名單…');
    try{
      const r=await jsonp({action:'verifyEntry',value});
      if(r.ok&&r.authorized){setStatus('驗證成功，正在進入題庫…','ok');setTimeout(()=>unlock(value),180);}
      else{setStatus(r.message||'資料不符，無法進入。','bad');valueEl.select();}
    }catch(err){setStatus(err.message||'驗證服務發生錯誤。','bad');}
    finally{verifyBtn.disabled=false;}
  }
  verifyBtn.addEventListener('click',verifyValue);
  valueEl.addEventListener('keydown',e=>{if(e.key==='Enter')verifyValue();});

  const remembered=getRemembered();
  if(remembered&&configured()){
    valueEl.value=remembered;
    verifyBtn.disabled=true;
    setStatus('正在確認已記憶的授權資料…');
    jsonp({action:'verifyEntry',value:remembered}).then(r=>{
      if(r.ok&&r.authorized){unlock(remembered);}
      else{
        clearRemembered();
        valueEl.value='';
        setStatus(r.message||'原授權資料已失效，請重新輸入。','bad');
        verifyBtn.disabled=false;
        valueEl.focus();
      }
    }).catch(()=>{
      setStatus('暫時無法確認已記憶的授權資料，請稍後再試。','bad');
      verifyBtn.disabled=false;
    });
  }else{
    if(remembered&&!configured())clearRemembered();
    setTimeout(()=>valueEl.focus(),0);
  }
})();

","source":"原始整理題庫","source_num":336,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q4548dc61425f"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳交易(Emissions trading)？","options":{"A":"企業之間交易碳權的市場機制","B":"政府對碳排放量設定上限的政策","C":"企業對碳排放量設定目標的行動","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":337,"exam":"題庫整理","explanation":"","category":"碳定價、碳權與CBAM","id":"qe5de54a101bd"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色供應鏈管理？","options":{"A":"管理供應鏈中的環境風險","B":"管理供應鏈中的社會風險","C":"管理供應鏈中的經濟風險","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":338,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q09fbfc7c50d1"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是環境、社會和公司治理(Environmental, Social, and Governance, ESG)？","options":{"A":"企業評估投資風險的指標","B":"企業評估永續發展績效的指標","C":"政府評估企業社會責任的指標","D":"以上皆是"},"answer":"B","source":"原始整理題庫","source_num":339,"exam":"題庫整理","explanation":"","category":"ESG、揭露與企業倡議","id":"q16066932fe4e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色科技(Green technology)？","options":{"A":"對環境友善的科技","B":"對社會有益的科技","C":"對經濟有貢獻的科技","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":340,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q50d2eb03550a"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是氣候變遷風險評估？","options":{"A":"評估企業因氣候變遷導致財務損失的風險","B":"評估企業因碳排放超標被罰款的風險","C":"評估企業因投資綠能產業失敗的風險","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":341,"exam":"題庫整理","explanation":"","category":"國際氣候治理與政策","id":"q013be3ca4543"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是淨零排放(Net-zero emissions)？","options":{"A":"完全不排放溫室氣體","B":"碳排放量等於碳吸收量","C":"碳排放量低於法規標準","D":"碳排放量逐年下降"},"answer":"B","source":"原始整理題庫","source_num":342,"exam":"題庫整理","explanation":"","category":"淨零、碳中和與碳匯","id":"q099de0ec4405"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是氣候變遷(Climate change)？","options":{"A":"短期天氣變化","B":"長期氣候平均狀態的顯著改變","C":"地震等自然災害","D":"以上皆是"},"answer":"B","source":"原始整理題庫","source_num":343,"exam":"題庫整理","explanation":"","category":"國際氣候治理與政策","id":"qcb4d35d90ce6"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是氣候變遷情境分析(Climate change scenario analysis)？","options":{"A":"分析不同氣候變遷情境對企業的影響","B":"分析不同氣候變遷情境對社會的影響","C":"分析不同氣候變遷情境對環境的影響","D":"以上皆是"},"answer":"D","source":"原始整理題庫","source_num":344,"exam":"題庫整理","explanation":"","category":"國際氣候治理與政策","id":"qa1e287c72de1"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳揭露專案(Carbon Disclosure Project, CDP)？","options":{"A":"政府要求企業揭露碳排放量的計畫","B":"企業自願揭露碳排放量的計畫","C":"非營利組織推動企業揭露環境資訊的平台","D":"以上皆非"},"answer":"C","source":"原始整理題庫","source_num":345,"exam":"題庫整理","explanation":"（CDP是一個非營利組織，推動企業和城市揭露其環境影響資訊，包括碳排放、水資源管理和森林保護等。）","category":"ESG、揭露與企業倡議","id":"qb1508d3e5bf8"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色物流？","options":{"A":"使用環保運輸工具的物流","B":"使用再生能源的物流","C":"減少包裝材料的物流","D":"以上皆是"},"answer":"D","source":"原始整理題庫","source_num":346,"exam":"題庫整理","explanation":"","category":"能源與減碳技術","id":"q07664f7fbcf9"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色供應鏈(Green supply chain)？","options":{"A":"僅使用環保材料的供應鏈","B":"僅使用再生能源的供應鏈","C":"在整個供應鏈中納入環境考量的供應鏈","D":"以上皆是"},"answer":"C","source":"原始整理題庫","source_num":347,"exam":"題庫整理","explanation":"","category":"能源與減碳技術","id":"q3a22ebafab03"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是巴黎協定(Paris Agreement)？","options":{"A":"2015年簽署的國際氣候協議，旨在將全球暖化控制在2°C以內","B":"2015年簽署的國際貿易協議，旨在促進自由貿易","C":"2015年簽署的國際環境協議，旨在保護生物多樣性","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":348,"exam":"題庫整理","explanation":"","category":"國際氣候治理與政策","id":"qf1db481eef58"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是氣候變遷減緩(Climate change mitigation)？","options":{"A":"減緩氣候變遷的行動","B":"適應氣候變遷的行動","C":"預測氣候變遷的行動","D":"扭轉氣候變遷的行動"},"answer":"A","source":"原始整理題庫","source_num":349,"exam":"題庫整理","explanation":"","also_sources":["原始整理題庫第355題"],"category":"國際氣候治理與政策","id":"q2ecabc318b1a"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳排放交易系統(Emissions Trading System, ETS)？","options":{"A":"政府對碳排放設定上限並允許企業交易排放許可的市場機制","B":"政府對低碳產品提供補貼的政策工具","C":"政府對高碳排放產品徵收關稅的政策工具","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":350,"exam":"題庫整理","explanation":"","category":"碳定價、碳權與CBAM","id":"qe03158bc1ed3"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是企業碳管理(Corporate carbon management)？","options":{"A":"企業測量、報告和管理其碳排放的過程","B":"政府對企業碳排放進行監管的過程","C":"非政府組織對企業碳排放進行評估的過程","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":351,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"qaaa7316786b4"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色旅遊(Green tourism)？","options":{"A":"到自然景點旅遊","B":"到生態保護區旅遊","C":"在旅遊過程中減少對環境影響的旅遊","D":"以上皆是"},"answer":"C","source":"原始整理題庫","source_num":352,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"qe9b35ee5acec"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳揭露(Carbon disclosure)？","options":{"A":"企業公開其碳排放資訊的行為","B":"政府要求企業揭露碳排放資訊的法規","C":"非營利組織收集和分析企業碳排放資訊的平台","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":354,"exam":"題庫整理","explanation":"（碳揭露是指企業公開其碳排放資訊的行為，包括排放量、減排目標和策略等。）","category":"ESG、揭露與企業倡議","id":"q65234db888d3"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色交通(Green transportation)？","options":{"A":"使用電動車的交通","B":"使用公共交通的交通","C":"使用自行車或步行的交通","D":"以上皆是"},"answer":"D","source":"原始整理題庫","source_num":356,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q53b7330b1a16"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色金融(Green finance)？","options":{"A":"促進環境可持續發展的金融服務","B":"促進社會可持續發展的金融服務","C":"促進經濟可持續發展的金融服務","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":357,"exam":"題庫整理","explanation":"","category":"ESG、揭露與企業倡議","id":"q454d5937b6c5"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳稅(Carbon tax)？","options":{"A":"對碳排放設定價格的稅收","B":"對低碳產品提供補貼的稅收","C":"對高碳排放產品徵收關稅的稅收","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":358,"exam":"題庫整理","explanation":"","category":"碳定價、碳權與CBAM","id":"qaa2204dd7f30"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是責任投資原則(Principles for Responsible Investment, PRI)？","options":{"A":"聯合國支持的、由投資者發起的倡議，旨在將ESG因素納入投資決策","B":"政府規範企業社會責任的法規","C":"非政府組織評估企業永續發展績效的標準","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":359,"exam":" 目標，旨在實現永續經營","C":"政府提出的17項目標，旨在實現環境保護","D":"非政府組織提出的17項目標，旨在實現社會正義"},"answer":"A","source":"原始整理題庫","source_num":398,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q39eec4753ed9"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳中和產品？","options":{"A":"完全不排放溫室氣體的產品","B":"其生命週期碳排放量為零的產品","C":"其生命週期碳排放量低於法規標準的產品","D":"其生命週期碳排放量經過碳抵換的產品"},"answer":"D","source":"原始整理題庫","source_num":399,"exam":"題庫整理","explanation":"","category":"碳足跡、LCA與碳標籤","id":"qeefedef68992"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色行銷？","options":{"A":"推廣環保產品的行銷方式","B":"推廣綠色生活方式的行銷方式","C":"推廣企業社會責任的行銷方式","D":"以上皆是"},"answer":"D","source":"原始整理題庫","source_num":400,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"qf84d23eced74"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色採購？","options":{"A":"購買環保產品的行為","B":"購買有機食品的行為","C":"購買節能家電的行為","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":401,"exam":"題庫整理","explanation":"（綠色採購是指優先購買對環境友善的產品或服務的行為。）","category":"能源與減碳技術","id":"qb58662451347"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳預算(Carbon budget)？","options":{"A":"政府用於減碳的預算","B":"企業用於減碳的預算","C":"為了將全球暖化控制在一定範圍內，所能排放的二氧化碳總量","D":"以上皆是"},"answer":"C","source":"原始整理題庫","source_num":402,"exam":"題庫整理","explanation":"","category":"國際氣候治理與政策","id":"q86edea276c1d"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳匯(Carbon sink)？","options":{"A":"吸收二氧化碳的自然或人工儲存庫","B":"排放二氧化碳的自然或人工來源","C":"減少二氧化碳排放的技術","D":"測量二氧化碳排放的工具"},"answer":"A","source":"原始整理題庫","source_num":403,"exam":"題庫整理","explanation":"","category":"淨零、碳中和與碳匯","id":"q2a8c0bfd6ab9"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是永續發展(Sustainable development)？","options":{"A":"經濟發展","B":"環境保護","C":"社會進步","D":"在不損害後代滿足其需求能力的前提下，滿足當代需求的發展"},"answer":"D","source":"原始整理題庫","source_num":404,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q9f28556c547a"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色能源(Green energy)？","options":{"A":"對環境友善的能源","B":"對社會有益的能源","C":"對經濟有貢獻的能源","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":405,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q924b3db3a223"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色經濟(Green economy)？","options":{"A":"以低碳、資源效率和社會包容為特徵的經濟","B":"以高碳、資源消耗和社會不平等為特徵的經濟","C":"以傳統產業為主的經濟","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":406,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q8e77b858f1b4"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是能源轉型(Energy transition)？","options":{"A":"從化石燃料轉向再生能源的過程","B":"從傳統能源轉向新能源的過程","C":"從集中式能源轉向分散式能源的過程","D":"以上皆是"},"answer":"D","source":"原始整理題庫","source_num":407,"exam":"題庫整理","explanation":"","category":"臺灣淨零政策與法規","id":"qae99a45a077f"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳邊境調整機制(Carbon Border Adjustment Mechanism, CBAM)？","options":{"A":"對進口產品徵收碳稅的機制","B":"對出口產品提供碳補貼的機制","C":"對高碳排放國家實施貿易制裁的機制","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":408,"exam":"題庫整理","explanation":"","category":"碳定價、碳權與CBAM","id":"q43becd335f55"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳捕集與利用(Carbon Capture and Utilization, CCU)？","options":{"A":"從大氣中移除二氧化碳的技術","B":"將二氧化碳轉化為其他產品的技術","C":"將二氧化碳長期儲存地下的技術","D":"以上皆是"},"answer":"B","source":"原始整理題庫","source_num":409,"exam":"題庫整理","explanation":"（CCU是指將二氧化碳轉化為其他產品的技術，例如燃料、化學品或建築材料。）","category":"其他基礎概念","id":"q121f10170121"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色化學(Green chemistry)？","options":{"A":"研究植物化學的學科","B":"研究環境污染的學科","C":"研究如何減少化學品對環境和人類健康影響的學科","D":"以上皆是"},"answer":"C","source":"原始整理題庫","source_num":410,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q87d7d8545c82"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是負排放技術(Negative emissions technologies, NETs)？","options":{"A":"減少碳排放的技術","B":"從大氣中移除二氧化碳的技術","C":"增加碳匯的技術","D":"以上皆是"},"answer":"D","source":"原始整理題庫","source_num":411,"exam":"題庫整理","explanation":"（負排放技術是能夠從大氣中移除二氧化碳，並將其儲存或利用的技術，包括造林、碳捕集與封存、直接空氣捕集等。）","category":"淨零、碳中和與碳匯","id":"q6251acff834e"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是氣候風險揭露(Climate risk disclosure)？","options":{"A":"企業揭露其碳排放量","B":"企業揭露其氣候變遷風險與機會","C":"企業揭露其減碳目標","D":"企業揭露其永續發展策略"},"answer":"B","source":"原始整理題庫","source_num":412,"exam":"題庫整理","explanation":"","category":"國際氣候治理與政策","id":"q2c4af1c73f93"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是永續農業(Sustainable agriculture)？","options":{"A":"採用化學肥料和農藥的農業","B":"採用基因改造作物的農業","C":"採用有機耕作的農業","D":"在保護環境、社會和經濟的前提下，生產糧食的農業"},"answer":"D","source":"原始整理題庫","source_num":413,"exam":"題庫整理","explanation":"","category":"ESG、揭露與企業倡議","id":"q1a4a5c30d42b"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是綠色建築(Green building)？","options":{"A":"節能、節水、減少廢棄物和使用環保材料的建築","B":"使用再生能源的建築","C":"採用綠色屋頂和綠色牆面的建築","D":"以上皆是"},"answer":"D","source":"原始整理題庫","source_num":414,"exam":"題庫整理","explanation":"","category":"能源與減碳技術","id":"q49eef74e67b4"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳足跡標籤(Carbon footprint label)？","options":{"A":"標示產品碳排放量的標籤","B":"標示產品能源效率的標籤","C":"標示產品水足跡的標籤","D":"標示產品回收率的標籤"},"answer":"A","source":"原始整理題庫","source_num":415,"exam":"題庫整理","explanation":"","category":"能源與減碳技術","id":"q9d7726c253e7"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是氣候變遷脆弱性評估(Climate change vulnerability assessment)？","options":{"A":"評估企業因氣候變遷導致財務損失的風險","B":"評估社區或生態系統對氣候變遷的敏感性和適應能力","C":"評估政府氣候政策的有效性","D":"以上皆非"},"answer":"B","source":"原始整理題庫","source_num":416,"exam":"題庫整理","explanation":"","category":"國際氣候治理與政策","id":"q29f7ac900fd2"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是碳定價(Carbon pricing)？","options":{"A":"對碳排放設定價格的政策工具","B":"對低碳產品提供補貼的政策工具","C":"對高碳排放產品徵收關稅的政策工具","D":"以上皆是"},"answer":"A","source":"原始整理題庫","source_num":419,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q4f9232c67735"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是社會責任投資(Socially responsible investing, SRI)？","options":{"A":"考慮環境、社會和治理(ESG)因素的投資","B":"僅考慮財務回報的投資","C":"僅考慮社會影響的投資","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":420,"exam":"題庫整理","explanation":"","category":"ESG、揭露與企業倡議","id":"q8b2cb03da479"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是範疇一排放？","options":{"A":"企業直接產生的溫室氣體排放","B":"企業因使用外購電力產生的溫室氣體排放","C":"企業供應鏈產生的溫室氣體排放","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":421,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"qc57e11ef1d37"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是範疇二排放？","options":{"A":"企業直接產生的溫室氣體排放","B":"企業因使用外購電力產生的溫室氣體排放","C":"企業供應鏈產生的溫室氣體排放","D":"以上皆非"},"answer":"B","source":"原始整理題庫","source_num":422,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"q069ed4df7abe"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是範疇三排放？","options":{"A":"企業直接產生的溫室氣體排放","B":"企業因使用外購電力產生的溫室氣體排放","C":"企業供應鏈產生的溫室氣體排放","D":"以上皆非"},"answer":"C","source":"原始整理題庫","source_num":423,"exam":"題庫整理","explanation":"","category":"其他基礎概念","id":"qf0dbccac8ec4"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"什麼是溫室氣體盤查的基線年？","options":{"A":"開始盤查的年份","B":"設定減碳目標的年份","C":"與其他年份進行比較的參考年份","D":"以上皆非"},"answer":"C","source":"原始整理題庫","source_num":424,"exam":"題庫整理","explanation":"（答案更正：來源 PDF 的答案卡印 D，但與 ISO 14064-1:2018 對「基準年（base year）」的定義不符 —— 該標準將基準年定義為「為了隨時間比較溫室氣體排放、移除或其他 GHG 相關資訊而選定的特定歷史期間」，正是選項 C；A 與 B 都不是。故正解為 C。）","category":"其他基礎概念","id":"q30bb38ec3555"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡研究中，敏感度分析通常用於：","options":{"A":"確定產品的市場定位","B":"識別關鍵參數和假設","C":"評估消費者偏好","D":"計算財務成本"},"answer":"B","source":"原始整理題庫","source_num":1,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q665412d8c5e2"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"ISO 14064‑1 中，來自輸入能源之間接溫室氣體排放量屬於：","options":{"A":"Category 4","B":"Category 2","C":"Category 3","D":"Category 1"},"answer":"B","source":"原始整理題庫","source_num":2,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qade2ca4f8e39"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"成立碳盤查工作小組的主要目的是什麼？","options":{"A":"蒐集相關活動數據與計算排放量","B":"進行市場調研","C":"制定公司政策","D":"規劃公司活動"},"answer":"A","source":"原始整理題庫","source_num":3,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qc50f4bdae2f9"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡計算中，對於電力使用的排放因數通常採用：","options":{"A":"最佳可用技術的排放因數","B":"全球平均值","C":"企業自身的發電排放因數","D":"地區或國家電網的平均排放因數"},"answer":"D","source":"原始整理題庫","source_num":4,"exam":"題庫整理"," ：淨零碳盤查規範與程序概要","stem":"組織須針對哪些排放源進行重大性鑑別？","options":{"A":"間接排放源","B":"直接排放源","C":"固定排放源","D":"移動排放源"},"answer":"A","source":"原始整理題庫","source_num":28,"exam":"題庫整理","explanation":"","category":"排放源與類別判定","id":"q013caa160810"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"CFP 研究報告中，關於電力的處理應包括：","options":{"A":"電網排放因數計算與相關電網特定約束的資訊","B":"電力價格的變化趨勢","C":"電力市場的競爭格局","D":"電力公司的盈利情況"},"answer":"A","source":"原始整理題庫","source_num":29,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q4ea290235bb6"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"第二階段現場查證通常包括以下哪項工作？","options":{"A":"第二階段活動數據實際抽樣","B":"邊界範圍界定","C":"SRRA 缺失改善之覆核","D":"查證申請書審核"},"answer":"A","source":"原始整理題庫","source_num":30,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q59639baa6a93"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"CFP 研究報告中，關於價值選擇，應該：","options":{"A":"隱藏所有價值選擇","B":"只報告有利的價值選擇","C":"揭露價值選擇及其理由","D":"忽略價值選擇的影響"},"answer":"C","source":"原始整理題庫","source_num":31,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qfed4e0ccc243"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"內部查證時，針對數據資訊面向的查證重點包括以下哪項？","options":{"A":"員工績效評估","B":"客戶開發策略","C":"產品研發計劃","D":"計算公式錯誤"},"answer":"D","source":"原始整理題庫","source_num":32,"exam":"題庫整理","explanation":"","category":"ISO 14064-1與查證","id":"qbba442be0f34"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"CFP 量化數值具備代表性的時間期間應如何確定？","options":{"A":"永遠使用最新的一年數據","B":"由監管機構統一規定","C":"應予指定並說明理由","D":"必須涵蓋產品的整個生命週期"},"answer":"C","source":"原始整理題庫","source_num":33,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q1a2d1ab6f90c"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"使用「混合法」計算採購貨物產生的排放時，不包括以下哪項？","options":{"A":"供應商上游活動數據","B":"供應商範疇 1 + 2 排放數據","C":"供應商的利潤率","D":"次級數據（如行業平均排放係數）"},"answer":"C","source":"原始整理題庫","source_num":34,"exam":"題庫整理","explanation":"","also_sources":["原始整理題庫第240題"],"category":"排放量計算與係數","id":"qb3007a547b7b"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"PCR 中的「推動產品碳足跡標示審議會技術小組審查意見及回應」主要目的是：","options":{"A":"提供產品銷售數據","B":"制定公司的市場策略","C":"分析競爭對手的產品 ,"options":{"A":"確保碳足跡研究符合標準要求","B":"確定產品碳足跡的市場競爭力","C":"比較不同計算方法的優劣","D":"評估產品的環境影響"},"answer":"A","source":"原始整理題庫","source_num":95,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qbe2f8dece19c"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡研究中，「供應鏈」是指：","options":{"A":"僅包括配送網絡","B":"從原料到最終用戶的所有過程","C":"僅包括製造過程","D":"僅包括直接供應商"},"answer":"B","source":"原始整理題庫","source_num":96,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qa1591384ca97"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在產品碳足跡盤查中，關於水體污染物排放的說法，哪項是正確的？","options":{"A":"水體污染物排放不屬於碳足跡盤查範圍","B":"需要收集廢水排放量和水體污染物資訊","C":"只需要考慮直接排入自然水體的污染物","D":"只需要收集用水量，不需要考慮排放"},"answer":"B","source":"原始整理題庫","source_num":97,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qb6109ef2a284"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"CFP 研究的範疇應與什麼一致？","options":{"A":"產品的銷售策略","B":"行業的平均水準","C":"CFP 研究的目標","D":"公司的財務狀況"},"answer":"C","source":"原始整理題庫","source_num":98,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qdf87ea9fea4d"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在活動數據檢核中，關於空水廢排放的說法，哪項是錯誤的？","options":{"A":"廢棄物不需提供處理方式","B":"需提供製程各項空水廢排放的項目名稱和實際排放量","C":"需提供廢水處理化學藥劑的運輸資訊","D":"需提供廢棄物的處理和運輸方式"},"answer":"A","source":"原始整理題庫","source_num":99,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q0d4f45dc0ff2"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在產品碳足跡盤查的數據收集過程中，以下哪項不是必須提供的運輸資訊？","options":{"A":"運輸距離","B":"物料的購買地點","C":"運輸方式（陸運、空運、海運）","D":"運輸工具的品牌"},"answer":"D","source":"原始整理題庫","source_num":100,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qdb0a8c90e9a7"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"計算外購蒸汽的間接排放時，排放係數應：","options":{"A":"自行測量","B":"由供應商提供並經第三方查證","C":"使用行業平均值","D":"使用默認值"},"answer":"B","source":"原始整理題庫","source_num":101,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qd88929716228"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在 CFP 研究中，如何處理來自航空器運輸之 GHG 排放？","options":{"A":"計入生物燃料排放","B":"計入化石燃料排放","C":"單獨記錄","D":"忽略不計"},"answer": e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"「A 公司溫室氣體盤查涵蓋台灣廠與大陸廠」屬於何種邊界？","options":{"A":"營運邊界","B":"組織邊界","C":"報告邊界","D":"以上皆非"},"answer":"B","source":"原始整理題庫","source_num":110,"exam":"題庫整理","explanation":"","category":"組織與報告邊界","id":"q3f8b68b47e62"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"碳足跡計算採生命週期概念，下列何者目的排放需納入總量？","options":{"A":"最終產品處理","B":"產品配送","C":"生產製造","D":"以上皆是"},"answer":"D","source":"原始整理題庫","source_num":111,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q8a3532f0af55"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"根據 ISO 14068，首要步驟為？","options":{"A":"確定碳足跡範圍、設定基線","B":"建立碳管理計畫","C":"執行碳排放測量","D":"設定減排目標並發布碳中和聲明"},"answer":"A","source":"原始整理題庫","source_num":112,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"qb002f432e45e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"歐盟 CBAM 要求何時繳交前一年度進口憑證？","options":{"A":"每年 1 月 31 日前","B":"每年 3 月 31 日前","C":"每年 9 月 30 日前","D":"每年 12 月 31 日前"},"answer":"C","source":"原始整理題庫","source_num":113,"exam":"題庫整理","explanation":"（選項已更新：原選項早於法規修訂，正解不在其中）","category":"其他盤查實務","id":"q2c782b0eb8f9"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依 Regulation (EU) 2023/956 第 22(2) 條（經 (EU) 2025/2083 修正），自 2027 年起，授權 CBAM 申報人於「每季末」其 CBAM 登錄簿帳戶中應「持有」的憑證，至少須對應自當年年初起累計進口 CBAM 貨物嵌入排放量的多少比例？","options":{"A":"25 %","B":"50 %","C":"75 %","D":"80 %"},"answer":"B","source":"原始整理題庫","source_num":114,"exam":"題庫整理","explanation":"（依 Reg (EU) 2023/956 第 22(2) 條，經 (EU) 2025/2083 修正：比例由 80% 調降為 50%，自 2027 年起適用；課予的是「每季末帳戶中應『持有』」的義務，而非「每季提前購買」。嵌入排放量之計算基礎得擇一：(a) Annex IV 預設值（不含加成）；或 (b) 前一年就相同 CN 碼與原產國貨物已繳交之憑證數量）","category":"盤查制度、法規與流程","id":"q8475ba390a30"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依 Regulation (EU) 2023/956 第 26(2) 條，「非授權 CBAM 申報人」之人將 CBAM 貨物輸入歐盟關稅領域而未履行本規則義務者，其罰鍰為第 26(1) 條罰鍰的幾倍？","options":{"A":"2 倍","B":"2–3 倍","C":"3–4 倍","D":"3–5 倍"},"answer":"D","source":"原始整理題庫","source_num":115,"exam":"題庫整理","explanation":"（第 26(2) 條：「非授權」之人「輸入」CBAM 貨物而未履行義務者，處第 26(1) 條罰鍰之 3–5 倍，按未繳交之每一張憑證計。請區別：授權申報人「未繳交憑證」適用第 26(1) 條（等同 Dir 2003/87/EC 第 16(3) 條之 ETS 超額排放罰鍰），不是 3–5 倍；而第 22(2) 條「季末帳戶餘額不足」依第 22(3) 條僅需於通知後 1 個月內補足，並無倍數罰則。原題幹「未於期間購買憑證」未區分行為人與違規類型，敘述有誤，已更正）","category":"盤查制度、法規與流程","id":"q5ca0ebff4ab0"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依規定，環境部納管或自願登錄企業應使用哪種邊界設定法？","options":{"A":"組織邊界設定法","B":"產品邊界設定法","C":"活動邊界設定法","D":"範疇邊界設定法"},"answer":"A","source":"原始整理題庫","source_num":116,"exam":"題庫整理","explanation":"（環境部納管／自願登錄採組織邊界，並以營運控制法界定）","category":"組織與報告邊界","id":"qda078ac62266"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"製造業直接＋間接排放量超過多少噸須被納管？","options":{"A":"2.5 萬噸","B":"2 萬噸","C":"1.5 萬噸","D":"1 萬噸"},"answer":"A","source":"原始整理題庫","source_num":117,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qbf2ff7de99f0"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"碳盤查「基準年」定義為？","options":{"A":"企業首次碳盤查年份","B":"後續年度比較之參考年","C":"計算預算年度","D":"政策制定年份"},"answer":"B","source":"原始整理題庫","source_num":118,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q20d6bb4f0e74"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"溫室氣體盤查作業基本程序，下列何者正確？","options":{"A":"納管事業邊界企業可自行設定","B":"盤查邊界無須與財報一致","C":"決定方法 → 蒐集數據 → 選排放係數 → 計算排放量","D":"企業可不界定盤查範圍"},"answer":"C","source":"原始整理題庫","source_num":119,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qf174669f54d6"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"有限確信 vs. 合理確信案件主要差異？","options":{"A":"邊界大小","B":"簽證人數","C":"單一標的 vs. 整體報告","D":"可接受風險水準低"},"answer":"D","source":"原始整理題庫","source_num":120,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"q99cf1a713169"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"歐盟 CBAM 排放量計算概念何者正確？","options":{"A":"計算全生命週期排放","B":"以生產總重量含包裝計算","C":"外部熱源計入直接排放","D":"廢棄物處理須計算排放"},"answer":"C","source":"原始整理題庫","source_num":121,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qb66379c100ab"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"歐盟進口商抵免 CBAM 憑證，可使用何種出口商抵免證明？","options":{"A":"貨物稅","B":"營業稅","C":"自願碳市場額度","D":"外顯碳價（碳稅／排放交易）"},"answer":"D","source":"原始整理題庫","source_num":122,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"q3f35c09f84b3"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"對於中間產品，計算其使用階段排放時需要：","options":{"A":"只計算最終消費者使用階段的排放","B":"忽略後續加工過程的排放","C":"考慮後續加工過程的排放並進行合理分配","D":"將所有排放歸責於最終產品製造商"},"answer":"C","source":"原始整理題庫","source_num":125,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qa69db65e2dc0"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在生命週期評估（LCA）的衝擊評估階段，溫室氣體排放與移除量應選擇哪種全球暖化潛勢（GWP）計算方法？","options":{"A":"100 年全球暖化潛勢（GWP100）","B":"輸入‑輸出分析","C":"組織範疇分析","D":"直接排放量計算"},"answer":"A","source":"原始整理題庫","source_num":126,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q90e794310748"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"使用「基於距離法」計算運輸排放時，不需要以下哪項數據？","options":{"A":"運輸公司的財務報表","B":"運具排放係數","C":"運輸重量","D":"運輸距離"},"answer":"A","source":"原始整理題庫","source_num":127,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qbce0dee29038"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"溫室氣體盤查報告書中，通常不包括以下哪個章節？","options":{"A":"財務報表","B":"報告邊界","C":"組織邊界","D":"溫室氣體量化"},"answer":"A","source":"原始整理題庫","source_num":128,"exam":"題庫整理","explanation":"","category":"組織與報告邊界","id":"qdfa2155ecbb6"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在建構產品生命週期製程流程圖時，如何避免錯漏？","options":{"A":"比對生產/品管用流程圖或清理計畫書，直接到現場了解","B":"只查看公司網站","C":"假設所有產品的流程都相同","D":"只依靠管理層的記憶"},"answer":"A","source":"原始整理題庫","source_num":129,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q1150f2687bfb"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"計算運輸排放量時，下列哪項不屬於活動數據？","options":{"A":"運輸費用金額","B":"運輸距離","C":"排放係數","D":"燃料消耗量"},"answer":"C","source":"原始整理題庫","source_num":130,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q3d736fcb4a92"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"功能或宣告單位的主要目的是什麼？","options":{"A":"確定產品的使用壽命","B":"確定產品的市場價值","C":"提供與其相關投入與產出之參考","D":"計算產品的生產成本"},"answer":"C","source":"原始整理題庫","source_num":131,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qd25d64efbc73"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"生命週期盤查分析（LCI）包括什麼？","options":{"A":"只包括使用階段的排放","B":"只包括廢棄階段的排放","C":"只包括生產階段的排放","D":"產品整個生命週期階段的投入與產出的彙總與量化"},"answer":"D","source":"原始整理題庫","source_num":133,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q6707c560832d"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"下列哪項不屬於計算由採購貨物產生的排放所需資訊？","options":{"A":"供應商的財務報表","B":"採購原料重量","C":"原料生產過程的能源消耗","D":"原料相關排放係數"},"answer":"A","source":"原始整理題庫","source_num":134,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qe652c29ea676"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"使用「混合法」計算採購貨物產生的排放時，可能包括以下哪項？","options":{"A":"只使用行業平均數據","B":"根據採購金額估算排放量","C":"只使用供應商提供的數據","D":"供應商範疇 1 + 2 排放數據與次級數據結合"},"answer":"D","source":"原始整理題庫","source_num":135,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qea3a0e44fb2f"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品類別規則 (PCR) 的說明，以下何者為非？","options":{"A":"為了使同性質產品能公平比較，計算碳足跡時要參考 PCR 的邊界設定","B":"PCR 是全球共通的","C":"經濟部工業局採用國際間使用的 EPD‑PCR","D":"國內申請碳標籤會用環保署的 CFP‑PCR"},"answer":"B","source":"原始整理題庫","source_num":136,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qf5c5ede9b8b4"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於產品碳足跡計算，下列敘述何者錯誤？","options":{"A":"單位產品活動數據 × 排放係數 = 碳排放量 (二氧化碳當量)","B":"建立 LCA 流程圖 → 界定系統邊界與活動數據蒐集優先順序 → 確認排放係數 → 收集活動數據 → 計算與分析 → 評估數據品質","C":"單位產品活動數據是標的產品每單位造成溫室氣體排放的量測值","D":"排放係數僅可使用環保署提供之係數表"},"answer":"D","source":"原始整理題庫","source_num":137,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q86178963a54f"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡盤查原則中的「重複計算」，以下敘述何者錯誤？","options":{"A":"若不同產品系統有共同製程，應確認此製程排放量分配規則","B":"透過分配規則將排放量分配到各產品避免重複計算","C":"可透過質量平衡確認是否重複計算，差異大於 10 % 則為異常","D":"若有異常可視為偶發現象，無需理會"},"answer":"D","source":"原始整理題庫","source_num":138,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q18dedabbb027"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"關於 ISO 14067 產品碳足跡規範，下列何者為非？","options":{"A":"產品功能單位或宣告單位之碳足跡或部分碳足跡","B":"必要文件為清單與報告書","C":"依 ISO 14064‑3 指引進行查證","D":"保證等級需符合預期使用者需求，並依 ISO 14060 系列"},"answer":"D","source":"原始整理題庫","source_num":139,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q8b678b4e80e6"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡盤查流程與碳標籤申請，下列敘述何者錯誤？","options":{"A":"若無相符 PCR 可直接依 ISO 14067","B":"若需碳標籤：引用 PCR → 計算 → 查證 → 申請","C":"查證只能由國內關鍵審查進行","D":"查證可由第三方或國內關鍵審查進行"},"answer":"C","source":"原始整理題庫","source_num":140,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q541e3edfbe86"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡一級活動數據，以下敘述何者錯誤？","options":{"A":"活動數據的選擇會影響後續數據品質評估","B":"一級活動數據為組織直接量測所得","C":"台電電錶用電量屬二級數據","D":"台電電錶用電量屬一級數據"},"answer":"C","source":"原始整理題庫","source_num":141,"exam":"題庫整理","explanation":"","category":"數據品質與不確定性","id":"q468f515a724e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡評估數據蒐集期間，以下敘述何者錯誤？","options":{"A":"持續供應產品應涵蓋至少一年","B":"可依產品特性調整期間","C":"季節性產品可只涵蓋其特定期間","D":"若評估期為一年則須以 1/1 至 12/31"},"answer":"D","source":"原始整理題庫","source_num":142,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qbbb59bffe6e3"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡科學方法優先順序，下列敘述何者錯誤？","options":{"A":"首選自然科學監測 (例：功率表測量用電)","B":"經濟價值比例為第二順位","C":"第二順位亦可依國際慣例","D":"第二順位可使用無物理關聯指標 (如行銷費)"},"answer":"D","source":"原始整理題庫","source_num":143,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q7927a7b4944c"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"以下何者不屬於產品生命週期階段？","options":{"A":"製造","B":"研發","C":"運輸","D":"使用"},"answer":"B","source":"原始整理題庫","source_num":144,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q70f127edf07b"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"B2B 型產品生命週期中包含哪個階段？","options":{"A":"回收","B":"原料取得","C":"廢棄","D":"使用"},"answer":"B","source":"原始整理題庫","source_num":145,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qfd3fc782a53f"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"原料取得過程不包含以下哪項？","options":{"A":"主要原料","B":"耗材","C":"材料成型","D":"次要原料"},"answer":"C","source":"原始整理題庫","source_num":146,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"q5fd86e48189a"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡計算基本上將排放係數乘上何種數據？","options":{"A":"總生產產品重量","B":"活動數據","C":"總生產產品數量","D 示產品水足跡的標籤","D":"標示產品回收率的標籤"},"answer":"B","source":"原始整理題庫","source_num":257,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qb8c40f21f351"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"什麼是碳盤查？","options":{"A":"計算企業用水量的過程","B":"計算企業用電量的過程","C":"計算企業溫室氣體排放量的過程","D":"計算企業廢棄物產量的過程"},"answer":"C","source":"原始整理題庫","source_num":258,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qf25815badb62"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"什麼是碳足跡盤查？","options":{"A":"計算企業溫室氣體排放量的過程","B":"計算產品生命週期碳排放量的過程","C":"計算個人碳排放量的過程","D":"以上皆非"},"answer":"B","source":"原始整理題庫","source_num":259,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qfed45eb8003e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"什麼是碳足跡管理？","options":{"A":"減少產品碳排放量的過程","B":"抵換產品碳排放量的過程","C":"規劃、執行、監測和報告產品碳足跡的過程","D":"以上皆是"},"answer":"C","source":"原始整理題庫","source_num":260,"exam":"題庫整理","explanation":"（碳足跡管理是指規劃、執行、監測和報告產品碳足跡的過程，旨在減少產品對環境的影響。）","category":"產品碳足跡與ISO 14067","id":"q16abcd4286d4"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"什麼是碳排放因子？","options":{"A":"計算溫室氣體排放量時使用的係數","B":"衡量溫室氣體排放強度的指標","C":"評估減碳潛力的工具","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":261,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qaf3ba4a84e2d"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"什麼是產品碳足跡？","options":{"A":"產品在生產過程中產生的碳排放量","B":"產品在使用過程中產生的碳排放量","C":"產品在廢棄處理過程中產生的碳排放量","D":"產品從原料取得、製造、配送、使用到廢棄處理的整個生命週期中產生的碳排放量"},"answer":"D","source":"原始整理題庫","source_num":262,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q1ec75a276b10"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"組織如何確保其溫室氣體盤查的一致性，以便於時間上的比較？","options":{"A":"每年更換計算方法","B":"維持使用相同的數據來源和計算方法","C":"僅報告最大的排放源","D":"忽略小規模排放源"},"answer":"B","source":"原始整理題庫","source_num":263,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qf5adcd846b3e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"溫室氣體盤查報告原則中，何者是為了使溫室氣體相關資訊能有意義比較，以及容許有意義的跨年度或同產業排放比較？","options":{"A":"準確性","B":"一致性","C":"完整性","D":"透明度"},"answer":"B","source":"原始整理題庫","source_num":264,"exam":"題庫整理","explanation":"","category":"盤查制度、法規與流程","id":"q9044535d13bd"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依據標準組織型溫室氣體盤查須納入所有相關的溫室氣體排放與移除。其遵循的盤查原則是？","options":{"A":"準確性","B":"完整性","C":"一致性","D":"相關性"},"answer":"B","source":"原始整理題庫","source_num":265,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"q96ccf1145f94"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"企業進行溫室氣體盤查的第一步是什麼？","options":{"A":"設定邊界鑑別排放源","B":"收集活動數據與計算排放量","C":"請高階主管指派溫室氣體盤查小組","D":"文件化紀錄"},"answer":"C","source":"原始整理題庫","source_num":266,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q48afeb955925"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在進行溫室氣體盤查時，如何確保報告的完整性？","options":{"A":"報告主要排放源","B":"僅關注直接排放","C":"包括所有相關的直接和間接排放源","D":"忽略間接排放源"},"answer":"C","source":"原始整理題庫","source_num":267,"exam":"題庫整理","explanation":"","category":"排放源與類別判定","id":"q7511b2d04b6b"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"C公司在溫室氣體盤查報告書提到盤查的範圍包含桃園廠與小港廠。依據ISO14064-1:2018最新條文規範，請問這段描述內容描述的是界定何種邊界？","options":{"A":"組織邊界","B":"營運邊界","C":"報告邊界","D":"系統邊界"},"answer":"A","source":"原始整理題庫","source_num":268,"exam":"題庫整理","explanation":"","category":"組織與報告邊界","id":"qe524d1d77cd6"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在溫室氣體盤查中，哪一項不是間接溫室氣體排放與移除的來源之一？","options":{"A":"來自輸入能源的間接溫室氣體排放量","B":"來自組織使用的產品的間接溫室氣體排放量","C":"來自運輸的間接溫室氣體排放量","D":"來自直接排放源的間接溫室氣體排放量"},"answer":"D","source":"原始整理題庫","source_num":269,"exam":"題庫整理","explanation":"","category":"排放源與類別判定","id":"q3d61040e25d5"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"下列何者為基準年溫室氣體盤查清冊的目的？","options":{"A":"降低未來報告的準確性","B":"增加報告的複雜度","C":"符合預期使用者的要求","D":"減少報告的透明度"},"answer":"C","source":"原始整理題庫","source_num":270,"exam":"題庫整理","explanation":"","category":"盤查制度、法規與流程","id":"qc99166cf8ace"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"請說明溫室氣體量化方法中，排放係數法的計算公式，何者正確？","options":{"A":"CO2排放當量=活動數據×排放係數×GWP","B":"CO2排放當量=活動數據×人口數量×GWP","C":"CO2排放當量=活動數據×面積占比×GWP","D":"CO2排放當量=活動數據×重量占比×GWP"},"answer":"A","source":"原始整理題庫","source_num":271,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q9d5c40e45319"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":".組織建立基準年溫室氣體排放量與移除量的歷史基準時，應考慮哪些因素？","options":{"A":"選擇公司創立年作為基準年","B":"使用代表性且可驗證的數據","C":"僅基於預算決定","D":"選擇任意一年作為基準年"},"answer":"B","source":"原始整理題庫","source_num":272,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"q3c40e9fa5ead"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"直接監測法與質量平衡法在溫室氣體量化中有什麼區別？","options":{"A":"直接監測法不考慮化學反應","B":"質量平衡法僅適用於能源消耗","C":"功能單位或宣告單位","D":"質量平衡法更適用於小規模排放源"},"answer":"A","source":"原始整理題庫","source_num":273,"exam":"題庫整理","explanation":"（直接監測法主要用於實際測量，而質量平衡法以基礎過程和反應的計算。）","category":"產品碳足跡與ISO 14067","id":"q212b94d2089a"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"碳足跡量化資訊應於碳足跡研究報告中揭露，以下何者可以不包含於報告之中？","options":{"A":"針對電力之處理","B":"選定的分配方法","C":"內外部議題","D":"執行時間"},"answer":"D","source":"原始整理題庫","source_num":274,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"q5f8eb4bd5224"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"直接監測法的特點是下列何者？","options":{"A":"成本低廉且易於實施","B":"準確度較高但少見","C":"常用於計算間接排放","D":"基於估算而非實際測量"},"answer":"B","source":"原始整理題庫","source_num":275,"exam":"題庫整理","explanation":"","category":"數據品質與不確定性","id":"qbf6818dff498"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"CFP研究中，當需要做出決定時，為什麼應優先參照自然科學方法？","options":{"A":"自然科學方法成本較低","B":"增加研究的創新性","C":"保證結果的客觀性與可靠性","D":"簡化研究過程"},"answer":"C","source":"原始整理題庫","source_num":276,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q25d71e442792"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"CFP研究如何確保完整性？","options":{"A":"僅關注主要GHG排放源","B":"忽略不重要的GHG排放源","C":"適當揭露假設、方法及數據的使用","D":"僅計算直接排放"},"answer":"C","source":"原始整理題庫","source_num":277,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q062c311bbb94"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡(CFP)量化時，為何需要考慮產品/活動的整個生命週期？","options":{"A":"降低成本","B":"簡化分析過程","C":"增加報告的複雜度","D":"增加報告的頁數"},"answer":"C","source":"原始整理題庫","source_num":278,"exam":"題庫整理","explanation":"（生命週期觀點原則，強調考量產品從原物料取得、設計、製造、運輸/配送、使用到生命終結處理階段的整個過程，以確保CFP量化結果能全面反映產品對環境影響的真實情況）","category":"產品碳足跡與ISO 14067","id":"qb8bead312593"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足跡過程盤查中，繪製製程地圖是一關鍵步驟，針對此一步驟以下描述何者為非？","options":{"A":"列出流程各關卡負責單位與人員","B":"列出流程內的投入與產出","C":"確定繪製標的及其功能/宣告單位","D":"列出製造產品，須經過哪些步驟"},"answer":"A","source":"原始整理題庫","source_num":279,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q24bced9008eb"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在考慮未來盤查複雜度時，應如何處理製程流程圖？","options":{"A":"完全不進行簡化","B":"隨意刪除一些看似不重要的步驟","C":"做適度簡化，保留重要信息","D":"僅保留開頭和結尾的步驟"},"answer":"C","source":"原始整理題庫","source_num":280,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"q471b7fca8f09"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"系統邊界的選擇應基於什麼原則？","options":{"A":"個人喜好","B":"研究目標一致性","C":"最簡單的製程","D":"最低成本"},"answer":"B","source":"原始整理題庫","source_num":281,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qfc2666b0447e"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"以下何者為B2B產品在生命週期的描述方式？","options":{"A":"從搖籃到大門","B":"從搖籃到墳墓","C":"從搖籃到天堂","D":"以上皆非"},"answer":"A","source":"原始整理題庫","source_num":282,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q8b054a70ad4f"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"計算產品碳足跡時，須事先找尋符合的產品類別規則嗎？","options":{"A":"需要","B":"不需要","C":"隨心情而定","D":"以上皆可"},"answer":"A","source":"原始整理題庫","source_num":283,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q6ab4ed65b307"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"提供服務時，應如何確保製程流程圖的完整性？","options":{"A":"假設所有服務流程相同","B":"僅記錄服務開始和結束","C":"思考被服務對象在系統中的全程體驗","D":"僅考慮服務的主要部分"},"answer":"C","source":"原始整理題庫","source_num":284,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"qde0b510f66b4"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在產品類別規則(PCR)中，設定「系統邊界」的主要目的是為了什麼？","options":{"A":"確認產品的銷售區域和目標市場","B":"計算產品的市場價值和銷售利潤","C":"選擇產品的原材料來源和供應商","D":"定義在碳足跡評估中將考慮哪些生命週期階段"},"answer":"D","source":"原始整理題庫","source_num":285,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qa91803b58712"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"衝擊評估階段屬於生命週期評估作業LCA的第幾階段？","options":{"A":"第一階段","B":"第 研究報告中，透明度原則要求什麼？","options":{"A":"僅報告最終結果","B":"不揭露敏感數據","C":"適當揭露假設、方法及數據的應用","D":"避免使用專業術語"},"answer":"C","source":"原始整理題庫","source_num":364,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q7ba8e96168e4"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在CFP研究中，如何避免GHG排放與移除的重複計算？","options":{"A":"忽略所有間接排放","B":"僅計算一次相同的GHG排放與移除","C":"功能單位或宣告單位","D":"僅關注直接排放"},"answer":"B","source":"原始整理題庫","source_num":365,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qf01c4713534a"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"碳足跡是針對一項活動或產品整個生命週期過程所直接與間接產生的溫室氣體，下列何者須計算？","options":{"A":"原料取得","B":"製造階段","C":"配送階段","D":"以上皆須計算"},"answer":"D","source":"原始整理題庫","source_num":366,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q38cce8024a12"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"以下何者是需被納入B2C產品碳足跡計算，但B2B產品不需被納入的生命週期階段","options":{"A":"產品使用階段","B":"原料取得階段","C":"生產製造階段","D":"以上皆須列入計算"},"answer":"A","source":"原始整理題庫","source_num":367,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qa5f0b4f55ad8"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"以下何者為B2C產品在生命週期的描述方式？","options":{"A":"從搖籃到大門","B":"從搖籃到墳墓","C":"從搖籃到天堂","D":"以上皆非"},"answer":"B","source":"原始整理題庫","source_num":368,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qd92be49eb3e8"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在建構產品生命週期製程流程圖的第一步應該是什麼？","options":{"A":"選擇適當的製程技術","B":"確定繪製的對象與功能單位","C":"蒐集廢棄物處理的數據","D":"計算能源消耗量"},"answer":"B","source":"原始整理題庫","source_num":369,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q24ebaca61137"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"製造產品時，確保製程流程完整性的方法是什麼？","options":{"A":"僅參考生產/品管用流程圖","B":"僅進行文件審查","C":"直接到現場了解並比對相關文件","D":"假設所有產品製造步驟相同"},"answer":"C","source":"原始整理題庫","source_num":370,"exam":"題庫整理","explanation":"","category":"其他盤查實務","id":"q6d41f8a5a893"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"產品碳足盤查過程中，針對特定的產品/服務進行環境宣告之生命週期範疇界定的作業程序文件。目的在使相同功能產品/服務就其環境衝擊量化後之環境宣告，具有一致的比較基礎。這份文件稱之為何？","options":{"A":"生命週期評估(LCA)","B":"物質安全資料表(MSDS)","C":"產品類別規則(PCR)","D":"物質流成本分析(MFCA)"},"answer":"C","source":"原始整理題庫","source_num":371,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qeb0b8b0d1537"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在產品類別規則(PCR)中，「功能單位」的目的是什麼？","options":{"A":"確定產品的最低銷售價格","B":"為產品系統量化績效提供參照單位","C":"計算產品的生產成本","D":"確定產品的市場定位"},"answer":"B","source":"原始整理題庫","source_num":372,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qf3a2012516b1"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"PCR文檔中提到的「系統邊界」是指什麼？","options":{"A":"產品的銷售範圍","B":"產品製造過程中使用的技術類型","C":"決定哪些階段的範疇納入碳足跡計算","D":"產品的利潤邊界"},"answer":"C","source":"原始整理題庫","source_num":373,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q814ca9c5b3d0"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"PCR中提及的「切斷規則」主要用於什麼目的？","options":{"A":"確定產品的銷售策略","B":"忽略碳足跡計算中的重要階段","C":"允許忽略對總排放貢獻微小的過程","D":"增加碳足跡計算的準確性"},"answer":"C","source":"原始整理題庫","source_num":374,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qd3219b47d8d1"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在產品類別規則(PCR)文檔中，對於名詞定義的描述主要目的是什麼？","options":{"A":"提供特定產品類別的專業術語解釋","B":"詳述產品的市場定位和銷售策略","C":"計算產品的生產成本和價格","D":"確定產品的銷售地區和目標客戶"},"answer":"A","source":"原始整理題庫","source_num":375,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q76ba62769241"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在進行產品碳足跡評估時，「功能單位」的設定主要用於實現什麼目標？","options":{"A":"確定產品的廣告與推廣策略","B":"作為衡量產品系統性能的基準點","C":"計算產品的製造與銷售成本","D":"確認產品在市場上的競爭力"},"answer":"B","source":"原始整理題庫","source_num":376,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qe3e2a76c91c3"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"盤查分析階段屬於生命週期評估作業LCA的第幾階段？","options":{"A":"第一階段","B":"第二階段","C":"第三階段","D":"第四階段"},"answer":"B","source":"原始整理題庫","source_num":377,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qe94566b033a4"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"在LCA的衝擊評估階段，溫室氣體排放與移除量應該選擇何種GWP值計算？","options":{"A":"GWP-10年","B":"GWP-100年","C":"GWP-200年","D":"GWP-500年"},"answer":"B","source":"原始整理題庫","source_num":378,"exam":"題庫整理","explanation":"","category":"排放量計算與係數","id":"qb1aa3022dfc1"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"功能單位是在哪個生命週期階段被定義？","options":{"A":"盤查分析","B":"目標範疇定義","C":"闡釋","D":"生命週期衝擊評估"},"answer":"B","source":"原始整理題庫","source_num":379,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q55f4059cd498"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"生命週期評估(LCA)的目的是什麼？","options":{"A":"僅評估產品的經濟效益","B":"評估產品或服務從原物料取得到最終處置的環境影響","C":"評估員工的工作效率","D":"計算產品的市場價值"},"answer":"B","source":"原始整理題庫","source_num":380,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qc78798c694e8"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"生命週期盤查分析(LCI)主要包括哪些內容？","options":{"A":"數據收集與清單計算","B":"員工訓練計畫","C":"銷售策略分析","D":"市場調研"},"answer":"A","source":"原始整理題庫","source_num":381,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"q00e62af1190b"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"生命週期闡釋的目的是什麼？","options":{"A":"提高產品銷量","B":"合併盤查分析與衝擊評估結果，提供決策支持","C":"選擇供應商","D":"招聘員工"},"answer":"B","source":"原始整理題庫","source_num":382,"exam":"題庫整理","explanation":"","category":"產品碳足跡與ISO 14067","id":"qa74e768bccbf"},{"subject":"第二科：淨零碳盤查規範與程序概要","stem":"依 Regulation (EU) 2023/956 第 26(1) 條，「授權 CBAM 申報人」未於期限前繳交足額 CBAM 憑證者，其罰鍰如何計算？","options":{"A":"按其未繳交之每一張憑證，處以與歐盟 ETS 超額排放罰鍰（Directive 2003/87/EC 第 16(3) 條）相同之金額","B":"處以第 26(1) 條罰鍰之 3 至 5 倍","C":"按未繳交憑證之市價處以 2 倍罰鍰","D":"不處罰鍰，僅須於 1 個月內補足憑證"},"answer":"A","source":"原始整理題庫","source_num":383,"exam":"題庫整理","explanation":"（第 26(1) 條：按未繳交之每一張憑證，處以與 Dir 2003/87/EC 第 16(3) 條相同之 ETS 超額排放罰鍰。選項 B 的 3–5 倍是第 26(2) 條，行為人是「非授權之人輸入貨物」；選項 D 是第 22(3) 條季末餘額不足的補正程序，不是繳交義務的罰則）","category":"盤查制度、法規與流程","id":"q8cb47845c895"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"某跨國企業集團主要從事資產管理與投資業務，近期規劃依循 SBTi 設定減碳目 標。經盤查後發現，其直接營運排放（Scope1）與用電排放（Scope2）占比極 低，大部分排放來自投資組合之被投資公司。 依據 SBTi 相關指引，該企業在設定減碳策略時，應優先強化下列何者？","options":{"A":"提升辦公室能源效率以降低範疇一排放","B":"採購再生能源以降低範疇二排放","C":"管理投融資組合之排放以降低範疇三排放","D":"汰換運輸設備以降低直接排放"},"answer":"C","source":"115年第1次官方考題","source_num":1,"exam":"115年第1次官方考題","explanation":"","category":"能源與減碳技術","id":"qf2e70d2fdbf6"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"為達成將全球升溫控制於 1.5°C 內之目標，於 COP28 之「全球盤點（Global Stocktake） 」決議中，明確提出至2030 年全球再生能源裝置容量之量化目標。下 列何者為該目標？","options":{"A":"提升至現有的 2 倍","B":"提升至現有的 3 倍","C":"提升至現有的 5 倍","D":"提升至現有的 10 倍"},"answer":"B","source":"115年第1次官方考題","source_num":2,"exam":"115年第1次官方考題","explanation":"","category":"國際氣候治理與政策","id":"qe52261a0d7a6"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"下列哪項制度是巴黎協定下的重要市場機制？","options":{"A":"清潔發展機制（Clean Development Mechanism, CDM）","B":"聯合履行（Joint Implementation, JI）","C":"國際排放交易（International Emissions Trading, IET）","D":"第六條碳市場機制（Article 6 Carbon Market Mechanisms）"},"answer":"D","source":"115年第1次官方考題","source_num":3,"exam":"115年第1次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q23b1722da2b0"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於 2023 年於杜拜舉行的 COP28，在最終決議中，締約方對化石燃料於能源系統 中的未來發展達成何種共識？","options":{"A":"立即停止所有化石燃料的投資","B":"在 2030 年前全面淘汰石油與天然氣","C":"在能源系統中轉型脫離化石燃料","D":"僅針對燃煤進行限制，不涉及石油與天然氣"},"answer":"C","source":"115年第1次官方考題","source_num":4,"exam":"115年第1次官方考題","explanation":"","category":"能源與減碳技術","id":"qa6ee6e9ceea4"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於 RE100，下列敘述何者不正確？","options":{"A":"RE100 促使企業使用再生能源，所接受的再生能源包含風力、太陽能、地熱、 水力、生質能、核能等 6 種","B":"再生能源價格波動相較化石燃料小，並有逐漸下降的趨勢，加入 RE100 可分散 未來能源短缺的風險，並控制生產成本","C":"目前全球許多企業響應並承諾於 2050 年前使用 100％再生能源電力","D":"RE100 認證可使企業接軌國際大廠，形成淨零碳排供應鏈，使企業合作關係更 緊密"},"answer":"A","source":"115年第1次官方考題","source_num":5,"exam":"115年第1次官方考題","explanation":"","category":"能源與減碳技術","id":"qd91c5a73a3ea"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"根據經濟部（2024）能源統計手冊，我國 2024 年發電結構中占比最高為哪一種發 電方式？","options":{"A":"燃煤","B":"燃氣","C":"再生能源","D":"核能"},"answer":"B","source":"115年第1次官方考題","source_num":6,"exam":"115年第1次官方考題","explanation":"","category":"能源與減碳技術","id":"q52a3c9d45c05"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"根據經濟部（2024）能源統計手冊，臺灣能源供應高度依賴進口，其能源自給率 約落在哪一區間？","options":{"A":"1～3%","B":"4～7%","C":"8～12%","D":"13%以上"},"answer":"B","source":"115年第1次官方考題","source_num":7,"exam":"115年第1次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"q39bbdd94a627"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"丹娜絲風災暴露臺灣電網的韌性問題，關於分散式電源（如太陽光電）在電網中 斷時未能發揮功能的原因，下列何者正確？","options":{"A":"颱風導致大型火力電廠受損，無法滿載發電","B":"光電場因設備位於戶外，普遍受強風直接損壞","C":"光電案場多與大電網系統相連，電網中斷時會啟動保護機制自動斷電","D":"臺灣儲能系統已足夠，但缺乏發電設備"},"answer":"C","source":"115年第1次官方考題","source_num":8,"exam":"115年第1次官方考題","explanation":"","category":"能源與減碳技術","id":"qc1a1a4a126e7"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"臺灣水資源面臨豐枯差異日趨明顯的挑戰。根據水資源調適政策中，由「需求 面」檢討管理以促進水資源使用效益的策略，下列何者不屬於其規劃內容？","options":{"A":"參考聯合國推動之水足跡概念，推動標示產品耗水量，減少高耗水產品之消 費","B":"建立合理公平之用水轉移機制，並考慮由不缺水國家輸入高耗水產品，以降低 國內水資源消耗","C":"推廣精密灌溉技術，並獎勵利用雨水灌溉之農業，以減少灌溉用水之消耗","D":"藉由科技造水，如海水淡化與廢汙水回收工程等，以提升備援供水能力"},"answer":"D","source":"115年第1次官方考題","source_num":9,"exam":"115年第1次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"qba9b6a8ae921"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"根據經濟部二次能源轉型政策，臺灣規劃在 2030 年的電力結構目標中，燃氣發 電、再生能源與燃煤發電的占比分別為何？","options":{"A":"燃氣 50%、再生能源 30%、燃煤 20%","B":"燃氣 42%、燃煤 39%、再生能源 12%","C":"燃氣 40%、再生能源 40%、燃煤 20%","D":"燃氣 60%、再生能源 20%、燃煤 20%"},"answer":"A","source":"115年第1次官方考題","source_num":10,"exam":"115年第1次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"q69133673c7a5"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"下列何者屬於可作為能源使用的燃料形式，而非僅為原料或衍生產品？","options":{"A":"生物質","B":"生質廢棄物","C":"生物燃料","D":"生物炭"},"answer":"C","source":"115年第1次官方考題","source_num":11,"exam":"115年第1次官方考題","explanation":"","category":"能源與減碳技術","id":"q38bd76f8c488"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"下列何者為關注氣候變遷可能導致資產錯誤定價及資本配置失衡，進而影響金融 體系穩定性的國際揭露框架？","options":{"A":"TNFD","B":"TIFD","C":"TCFD","D":"TAFD"},"answer":"C","source":"115年第1次官方考題","source_num":12,"exam":"115年第1次官方考題","explanation":"","category":"ESG、揭露與企業倡議","id":"q44b6cc317d26"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據氣候變遷相關財務揭露（TCFD）架構，氣候風險可區分為「實體風險」與 「轉型風險」 。下列何者屬於實體風險？","options":{"A":"碳定價政策導致企業營運成本上升","B":"市場需求與營運成本結構發生變化","C":"暴雨、颱風、乾旱等極端 , Utilization and Storage, CCUS）的主要目的？","options":{"A":"增加燃煤產能","B":"提升能源密度","C":"協助難減量產業減碳","D":"提高汽車燃油效率"},"answer":"C","source":"115年第1次官方考題","source_num":37,"exam":"115年第1次官方考題","explanation":"","category":"能源與減碳技術","id":"qf92f271b8d98"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"依據臺灣官方能源轉型規劃，下列何者最能描述氫能在 2050 年能源系統中的角 色？","options":{"A":"短期即取代所有電力","B":"屬於長期關鍵能源之一","C":"僅用於家用電器","D":"政府無氫能相關規劃"},"answer":"B","source":"115年第1次官方考題","source_num":38,"exam":"115年第1次官方考題","explanation":"","category":"臺灣淨零政策與法規","id":"q179302663d4d"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於歐盟碳邊境調整機制（Carbon Border Adjustment Mechanism, CBAM）的主要 目的，除解決碳洩漏問題外，另一個主要目的為何？","options":{"A":"確保所有進口貨品均符合歐洲安全標準","B":"鼓勵其他國家推動碳定價措施","C":"提升歐盟內部的工業技術標準","D":"促使出口國轉換經濟發展模式"},"answer":"B","source":"115年第1次官方考題","source_num":39,"exam":"115年第1次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"qcfb3568b0c83"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"在設定內部碳定價時，下列何種方式用來評估某企業單位面對減碳情境，或是因 應法遵碳成本支出等價格？","options":{"A":"市場價格調查","B":"影子碳價或隱含碳價","C":"能源稽核報告","D":"企業減排潛力分析"},"answer":"B","source":"115年第1次官方考題","source_num":40,"exam":"115年第1次官方考題","explanation":"","category":"其他基礎概念","id":"q2b2a224ebff9"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"關於核發減量額度（Carbon Credits，亦稱碳信用額度）之必要流程，下列何者不 正確？","options":{"A":"基礎情境比較","B":"繳交碳費","C":"計畫確證","D":"監測查證"},"answer":"B","source":"115年第1次官方考題","source_num":41,"exam":"115年第1次官方考題","explanation":"","category":"碳定價、碳權與CBAM","id":"q86ad7195a0fd"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"在碳減量或移除計畫（Carbon Reduction／Removal Project）品質要求中，判定 「外加性（Additionality） 」時，下列哪一項最能反映其核心評估原則？","options":{"A":"可量測、可報告、可驗證","B":"法規、投資、障礙性及普遍性要求","C":"法規要求、碳關稅要求、誠信原則","D":"不對社會環境造成影響"},"answer":"B","source":"115年第1次官方考題","source_num":42,"exam":"115年第1次官方考題","explanation":"","category":"其他基礎概念","id":"q58c38e62b715"},{"subject":"第一科：淨零碳規劃管理基礎概論","stem":"下列何者為碳交易所（Carbon Exchange）在碳權市場流程中的主要作用？","options":{"A":"管理內部帳戶的碳權轉移","B":"提供拍賣、定價及協議交易的平台","C":"直接核發碳權給計畫開發商(賣方)","D":"協助計畫註冊及資本投資"},"answer":"B","source"
